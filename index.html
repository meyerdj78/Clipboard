      </Card>

      <SHead>Assessment History</SHead>
      <Card>
        <p style={{fontSize:12,color:C.muted,marginBottom:10,lineHeight:1.6}}>Save a dated snapshot to see how the picture changes across the season. Current ratings stay editable.</p>
        <Ghost onClick={snapshot} style={{width:"100%",textAlign:"center",marginBottom:10}}>📌 Save snapshot for {today()}</Ghost>
        {(p.assessments||[]).length===0&&<p style={{fontSize:13,color:C.muted}}>No snapshots yet.</p>}
        {(p.assessments||[]).map(a=>(
          <div key={a.id} style={{borderBottom:`1px solid ${C.border}`,padding:"9px 0"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
              <button onClick={()=>setOpenSnap(openSnap===a.id?null:a.id)} style={{background:"none",border:"none",color:C.text,fontSize:14,cursor:"pointer",fontFamily:"inherit",padding:0}}>
                {openSnap===a.id?"▾":"▸"} {a.date}
              </button>
              <button onClick={()=>updatePlayer(p.id,{assessments:p.assessments.filter(x=>x.id!==a.id)})} style={{background:"none",border:"none",color:"#555",cursor:"pointer",fontSize:12}}>Delete</button>
            </div>
            {openSnap===a.id&&(
              <div style={{marginTop:8,fontSize:12,color:C.soft,lineHeight:1.8}}>
                {SKILLS.filter(sk=>a.competence?.[sk.key]>0).map(sk=>(
                  <div key={sk.key}>{sk.label}: <span style={{color:C.amber}}>{"★".repeat(a.competence[sk.key])}</span></div>
                ))}
                {BEHAVIOURS.filter(bh=>a.behaviour?.[bh.key]>0).map(bh=>(
                  <div key={bh.key}>{bh.label}: <span style={{color:C.blue}}>{a.behaviour[bh.key]}/5</span></div>
                ))}
              </div>
            )}
          </div>
        ))}
      </Card>

      <Ghost onClick={onBack} style={{width:"100%",textAlign:"center"}}>← Back to Players</Ghost>
      {picker&&<ComboPicker player={p} players={players} existing={combos} onAdd={addCombo} onClose={()=>setPicker(false)}/>}
    </>
  );
}

function StatChip({label,value,col}){
  return(
    <div style={{background:"#161616",border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 10px",textAlign:"center",minWidth:64,flex:1}}>
      <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:900,color:col||C.text,lineHeight:1.1}}>{value}</div>
      <div style={{fontSize:10,color:C.muted,marginTop:2}}>{label}</div>
    </div>
  );
}

function DiaryScreen({season,players,onOpenEvent,onAddEvent,onImport,onOpenTournament}){
  const evs=allEvents(season);
  const future=evs.filter(e=>isFuture(e.date)).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const past=evs.filter(e=>!isFuture(e.date)).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const tourns=[...(season.tournaments||[]),...(season.activeTournament?[season.activeTournament]:[])]
    .sort((a,b)=>String(b.date).localeCompare(String(a.date)));

  const Row=({e})=>{
    const t=evType(e.type);
    const fut=isFuture(e.date);
    const attended=players.filter(p=>["present","late"].includes(e.attendance?.[p.id])).length;
    const marked=Object.keys(e.attendance||{}).length;
    const yes=players.filter(p=>e.availability?.[p.id]==="yes").length;
    const no=players.filter(p=>e.availability?.[p.id]==="no").length;
    const asked=Object.keys(e.availability||{}).length;
    return(
      <div onClick={()=>onOpenEvent(e.id)} style={{display:"flex",gap:11,alignItems:"center",background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"12px 13px",marginBottom:8,cursor:"pointer"}}>
        <div style={{fontSize:19,flexShrink:0}}>{t.icon}</div>
        <div style={{minWidth:0,flex:1}}>
          <div style={{fontSize:15,fontWeight:600,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.title||t.label}</div>
          <div style={{fontSize:11,color:C.muted,marginTop:2}}>{e.date}{e.location?` · ${e.location}`:""}</div>
        </div>
        <div style={{textAlign:"right",flexShrink:0}}>
          {fut
            ? (asked
                ? <><div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:17,fontWeight:900,color:C.lime}}>{yes}<span style={{color:C.muted,fontSize:13}}>/{players.length}</span></div><div style={{fontSize:9,color:no?C.red:C.muted}}>{no?`${no} unavailable`:"available"}</div></>
                : <div style={{fontSize:10,color:C.amber}}>no availability yet</div>)
            : (marked
                ? <><div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:17,fontWeight:900,color:C.lime}}>{attended}<span style={{color:C.muted,fontSize:13}}>/{players.length}</span></div><div style={{fontSize:9,color:C.muted}}>attended</div></>
                : <div style={{fontSize:10,color:C.amber}}>no register</div>)}
        </div>
      </div>
    );
  };

  return(
    <>
      <h2 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:26,fontWeight:900,color:C.lime,margin:"0 0 3px"}}>Season Diary</h2>
      <div style={{fontSize:12,color:C.muted,marginBottom:16}}>{past.length} logged · {future.length} planned · {tourns.length} tournament{tourns.length!==1?"s":""}</div>

      <div style={{display:"flex",gap:7,marginBottom:18,flexWrap:"wrap"}}>
        {EV_TYPES.map(t=>(
          <button key={t.key} onClick={()=>onAddEvent(t.key)} style={{flex:"1 1 30%",padding:"10px 8px",background:"#1c1c1c",border:`1px solid ${C.border}`,borderRadius:7,color:C.soft,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>
            {t.icon} Add {t.label.toLowerCase()}
          </button>
        ))}
      </div>
      <Ghost onClick={onImport} style={{width:"100%",textAlign:"center",marginBottom:22}}>📋 Import attendance code</Ghost>

      {future.length>0&&<>
        <SHead>Coming up</SHead>
        {future.map(e=><Row key={e.id} e={e}/>)}
        <div style={{height:14}}/>
      </>}

      <SHead>Already happened</SHead>
      {past.length===0&&<Card><p style={{fontSize:13,color:C.muted}}>Nothing logged yet.</p></Card>}
      {past.map(e=><Row key={e.id} e={e}/>)}

      {tourns.length>0&&<>
        <div style={{height:14}}/>
        <SHead>Tournaments</SHead>
        {tourns.map(t=>{
          const att=(t.roster||[]).filter(r=>r.attending&&!r.ill).length;
          return(
            <div key={t.id} onClick={()=>onOpenTournament(t)} style={{display:"flex",gap:11,alignItems:"center",background:C.card,border:`1px solid ${t.status==="active"?C.lime:C.border}`,borderRadius:8,padding:"12px 13px",marginBottom:8,cursor:"pointer"}}>
              <div style={{fontSize:19}}>🏆</div>
              <div style={{minWidth:0,flex:1}}>
                <div style={{fontSize:15,fontWeight:600,color:C.text}}>{t.name}</div>
                <div style={{fontSize:11,color:C.muted,marginTop:2}}>{t.date}{t.status==="active"?" · active":""}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:17,fontWeight:900,color:C.lime}}>{att}</div>
                <div style={{fontSize:9,color:C.muted}}>squad</div>
              </div>
            </div>
          );
        })}
      </>}
    </>
  );
}

function EventScreen({event,players,patchEvent,deleteEvent,onBack,notify}){
  const fut=isFuture(event.date);
  const[tab,setTab]=useState(fut?"avail":"register");
  const[confirmDel,setConfirmDel]=useState(false);
  const att=event.attendance||{}, av=event.availability||{};
  const t=evType(event.type);

  const setAtt=(pid,st)=>patchEvent(event.id,{attendance:{...att,[pid]:att[pid]===st?undefined:st}});
  const setAv=(pid,st)=>patchEvent(event.id,{availability:{...av,[pid]:av[pid]===st?undefined:st}});
  const allAtt=st=>{const a={};players.forEach(p=>{a[p.id]=st;});patchEvent(event.id,{attendance:a});};
  const allAv=st=>{const a={};players.forEach(p=>{a[p.id]=st;});patchEvent(event.id,{availability:a});};
  const copyAvail=()=>{
    const a={...att};
    players.forEach(p=>{if(av[p.id]==="no")a[p.id]="excused";});
    patchEvent(event.id,{attendance:a});
    notify("Known absences marked excused ✓");
  };

  const sorted=[...players].sort((a,b)=>a.name.localeCompare(b.name));
  const states=tab==="avail"?AVAIL:ATT_STATES;
  const cur=tab==="avail"?av:att;
  const setCur=tab==="avail"?setAv:setAtt;

  return(
    <>
      <Breadcrumb crumbs={[{label:"Diary",onClick:onBack},{label:event.title||t.label}]}/>
      <Card>
        <Lbl mt={0}>Title</Lbl>
        <Inp value={event.title} onChange={e=>patchEvent(event.id,{title:e.target.value})}/>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          <div style={{flex:1,minWidth:130}}><Lbl>Date</Lbl><Inp type="date" value={event.date} onChange={e=>patchEvent(event.id,{date:e.target.value})}/></div>
          <div style={{flex:1,minWidth:130}}><Lbl>Location</Lbl><Inp placeholder="optional" value={event.location||""} onChange={e=>patchEvent(event.id,{location:e.target.value})}/></div>
        </div>
        <Lbl>Type</Lbl>
        <div style={{display:"flex",gap:6}}>
          {EV_TYPES.map(x=>(
            <button key={x.key} onClick={()=>patchEvent(event.id,{type:x.key})} style={{flex:1,padding:"9px",borderRadius:6,cursor:"pointer",fontFamily:"inherit",fontSize:13,border:`1px solid ${event.type===x.key?x.col:"#333"}`,background:event.type===x.key?x.col:"#212121",color:event.type===x.key?"#111":C.soft,fontWeight:event.type===x.key?700:400}}>{x.icon} {x.label}</button>
          ))}
        </div>
        <Lbl>Notes</Lbl>
        <textarea value={event.notes||""} onChange={e=>patchEvent(event.id,{notes:e.target.value})} placeholder="What you worked on, anything worth remembering…"
          style={{background:"#1c1c1c",border:`1px solid ${C.border}`,borderRadius:6,color:C.text,padding:"10px 12px",fontSize:16,width:"100%",height:70,outline:"none",resize:"vertical",fontFamily:"inherit",boxSizing:"border-box"}}/>
      </Card>

      <div style={{display:"flex",gap:6,marginBottom:12}}>
        <button onClick={()=>setTab("avail")} style={{flex:1,padding:"11px",borderRadius:7,cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",fontSize:15,fontWeight:700,letterSpacing:0.5,border:`1px solid ${tab==="avail"?C.blue:"#333"}`,background:tab==="avail"?C.blue:"transparent",color:tab==="avail"?"#fff":C.soft}}>Availability</button>
        <button onClick={()=>setTab("register")} style={{flex:1,padding:"11px",borderRadius:7,cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",fontSize:15,fontWeight:700,letterSpacing:0.5,border:`1px solid ${tab==="register"?C.grass:"#333"}`,background:tab==="register"?C.grass:"transparent",color:tab==="register"?"#fff":C.soft}}>Register</button>
      </div>

      <Card>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:12}}>
          {states.map(st=>(
            <StatChip key={st.key} label={st.label} col={st.col} value={players.filter(p=>cur[p.id]===st.key).length}/>
          ))}
          <StatChip label="Not set" col="#444" value={players.filter(p=>!cur[p.id]).length}/>
        </div>
        <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
          {tab==="avail"
            ? <><Ghost onClick={()=>allAv("yes")}>All available</Ghost><Ghost onClick={()=>allAv(null)}>Clear</Ghost></>
            : <><Ghost onClick={()=>allAtt("present")}>All present</Ghost><Ghost onClick={copyAvail}>Excuse known absences</Ghost></>}
        </div>
        {sorted.map(p=>(
          <div key={p.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,padding:"7px 0",borderBottom:`1px solid ${C.border}`}}>
            <span style={{fontSize:14,flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</span>
            <div style={{display:"flex",gap:4,flexShrink:0}}>
              {states.map(st=>(
                <button key={st.key} onClick={()=>setCur(p.id,st.key)} title={st.label}
                  style={{width:36,height:32,borderRadius:5,cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:700,
                    background:cur[p.id]===st.key?st.col:"#212121",color:cur[p.id]===st.key?"#111":"#555",
                    border:`1px solid ${cur[p.id]===st.key?st.col:"#333"}`}}>{st.short}</button>
              ))}
            </div>
          </div>
        ))}
        <p style={{fontSize:11,color:"#444",marginTop:10}}>
          {tab==="avail"?"Record these weeks ahead so you can balance game time before the gap arrives.":"P present · L late · E excused (not counted) · A absent."}
        </p>
      </Card>

      {confirmDel
        ? <Card style={{border:`1px solid ${C.red}`}}>
            <p style={{fontSize:13,color:C.soft,marginBottom:12}}>Delete this event and its records? Cannot be undone.</p>
            <div style={{display:"flex",gap:10}}>
              <Ghost onClick={()=>setConfirmDel(false)}>Cancel</Ghost>
              <PBtn style={{marginTop:0,flex:1}} color={C.red} onClick={()=>{deleteEvent(event.id);onBack();notify("Event deleted");}}>Delete</PBtn>
            </div>
          </Card>
        : <Ghost onClick={()=>setConfirmDel(true)} style={{color:C.red,borderColor:C.red}}>Delete this event</Ghost>}
    </>
  );
}

function SquadScreen({season,players,onOpenPlayer,onAssess,addPlayer,updatePlayer,notify}){
  const[q,setQ]=useState("");
  const[filt,setFilt]=useState("all");
  const[sortBy,setSortBy]=useState("name");
  const[adding,setAdding]=useState(false);
  const[newName,setNewName]=useState("");
  const[guest,setGuest]=useState(false);
  const evs=allEvents(season).filter(e=>e.type==="training");

  let list=players.filter(p=>!q||p.name.toLowerCase().includes(q.toLowerCase()));
  if(filt!=="all") list=list.filter(p=>p.positions.includes(filt));
  list=[...list].sort((a,b)=>{
    if(sortBy==="training")return (attStats(evs,b.id).rate??-1)-(attStats(evs,a.id).rate??-1);
    if(sortBy==="halves")return b.seasonHalves-a.seasonHalves;
    return a.name.localeCompare(b.name);
  });

  return(
    <>
      <h2 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:26,fontWeight:900,color:C.lime,margin:"0 0 3px"}}>Squad</h2>
      <div style={{fontSize:12,color:C.muted,marginBottom:14}}>{players.length} players</div>

      <PBtn style={{marginTop:0,marginBottom:10}} color={C.blue} onClick={onAssess}>⚡ Rapid Assess</PBtn>

      <Inp placeholder="Search…" value={q} onChange={e=>setQ(e.target.value)} style={{marginBottom:10}}/>

      <div style={{display:"flex",gap:5,marginBottom:8,flexWrap:"wrap"}}>
        <Pill active={filt==="all"} onClick={()=>setFilt("all")}>All</Pill>
        {POSITIONS.map(x=><Pill key={x.key} active={filt===x.key} onClick={()=>setFilt(x.key)}>{x.short}</Pill>)}
      </div>
      <div style={{display:"flex",gap:5,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
        <span style={{fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:1}}>Sort</span>
        <Pill active={sortBy==="name"} onClick={()=>setSortBy("name")}>Name</Pill>
        <Pill active={sortBy==="training"} onClick={()=>setSortBy("training")}>Training</Pill>
        <Pill active={sortBy==="halves"} onClick={()=>setSortBy("halves")}>Halves</Pill>
      </div>

      <Card style={{padding:"4px 16px"}}>
        {list.length===0&&<p style={{fontSize:13,color:C.muted,padding:"14px 0"}}>Nobody matches.</p>}
        {list.map(p=>{
          const a=attStats(evs,p.id);
          const tn=tournamentsAttended(season,p.id);
          const unavail=upcomingUnavailable(season,p.id).length;
          return(
            <div key={p.id} onClick={()=>onOpenPlayer(p.id)} style={{padding:"12px 0",borderBottom:`1px solid ${C.border}`,cursor:"pointer"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
                <span style={{fontSize:15,fontWeight:600,color:p.ill?C.muted:C.text,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                  {p.name}{p.isGuest?" 👤":""}{p.ill?" 🤒":""}
                </span>
                <span style={{color:C.muted,fontSize:17,flexShrink:0}}>›</span>
              </div>
              <div style={{display:"flex",gap:12,marginTop:5,flexWrap:"wrap",alignItems:"center"}}>
                <span style={{fontSize:11,color:C.muted}}>🏃 <span style={{color:a.rate===null?"#444":a.rate>=80?C.lime:a.rate>=50?C.amber:C.red,fontWeight:700}}>{a.rate===null?"—":a.rate+"%"}</span></span>
                <span style={{fontSize:11,color:C.muted}}>🏆 <span style={{color:C.text,fontWeight:700}}>{tn}</span></span>
                <span style={{fontSize:11,color:C.muted}}>⏱ <span style={{color:C.text,fontWeight:700}}>{p.seasonHalves}</span> halves</span>
                {unavail>0&&<span style={{fontSize:11,color:C.red}}>✕ {unavail} ahead</span>}
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:5}}>
                {p.positions.length===0&&<span style={{fontSize:10,color:"#4a4a4a"}}>no positions set</span>}
                {p.positions.map(k=><span key={k} style={{background:p.primary===k?C.amber:"#252525",color:p.primary===k?"#111":C.soft,border:`1px solid ${p.primary===k?C.amber:"#333"}`,borderRadius:4,padding:"1px 6px",fontSize:10,fontWeight:p.primary===k?700:400}}>{posShort(k)}</span>)}
                {(p.preferred||[]).length>0&&<span style={{fontSize:10,color:C.blue,marginLeft:2}}>♥ {(p.preferred||[]).map(posShort).join(" ")}</span>}
              </div>
            </div>
          );
        })}
      </Card>

      {adding?(
        <Card>
          <Lbl mt={0}>Add player</Lbl>
          <Inp placeholder="Name…" value={newName} onChange={e=>setNewName(e.target.value)}/>
          <div style={{display:"flex",gap:6,marginTop:8}}>
            <Pill active={!guest} onClick={()=>setGuest(false)}>Permanent</Pill>
            <Pill active={guest} onClick={()=>setGuest(true)} col={C.blue}>Guest</Pill>
          </div>
          <div style={{display:"flex",gap:10,marginTop:12}}>
            <Ghost onClick={()=>{setAdding(false);setNewName("");}}>Cancel</Ghost>
            <PBtn style={{marginTop:0,flex:1}} disabled={!newName.trim()} onClick={()=>{addPlayer(newName,guest);setNewName("");setAdding(false);notify("Player added ✓");}}>Add</PBtn>
          </div>
        </Card>
      ):<Ghost onClick={()=>setAdding(true)} style={{width:"100%",textAlign:"center",marginTop:12}}>+ Add player</Ghost>}
    </>
  );
}

function AnalysisScreen({season,players}){
  const[filt,setFilt]=useState("all");
  const[sortKey,setSortKey]=useState("name");
  const[desc,setDesc]=useState(false);
  const[cols,setCols]=useState(["training","tournaments","halves"]);
  const evs=allEvents(season).filter(e=>e.type==="training");

  const COLS=[
    {key:"training",label:"Train %",get:p=>attStats(evs,p.id).rate,fmt:v=>v===null?"—":v+"%"},
    {key:"sessions",label:"Sessions",get:p=>attStats(evs,p.id).attended,fmt:v=>v},
    {key:"tournaments",label:"Tourns",get:p=>tournamentsAttended(season,p.id),fmt:v=>v},
    {key:"halves",label:"Halves",get:p=>p.seasonHalves,fmt:v=>v},
    {key:"treds",label:"TREDS",get:p=>tredsScore(p)?.avg??null,fmt:v=>v===null?"—":v.toFixed(1)},
    {key:"combos",label:"Links",get:p=>combosFor(season,p.id).length,fmt:v=>v},
    {key:"focus",label:"Focus",get:p=>p.focus.length,fmt:v=>v},
    {key:"unavail",label:"Away",get:p=>upcomingUnavailable(season,p.id).length,fmt:v=>v},
  ];
  const active=COLS.filter(c=>cols.includes(c.key));

  let rows=players.filter(p=>filt==="all"||p.positions.includes(filt));
  rows=[...rows].sort((a,b)=>{
    if(sortKey==="name")return desc?b.name.localeCompare(a.name):a.name.localeCompare(b.name);
    const c=COLS.find(x=>x.key===sortKey);
    const av=c.get(a)??-1, bv=c.get(b)??-1;
    return desc?av-bv:bv-av;
  });

  const csv=()=>{
    const head=["Name","Positions","Preferred",...active.map(c=>c.label)].join(",");
    const body=rows.map(p=>[
      '"'+p.name+'"',
      '"'+p.positions.map(posLabel).join("; ")+'"',
      '"'+(p.preferred||[]).map(posLabel).join("; ")+'"',
      ...active.map(c=>{const v=c.get(p);return v===null||v===undefined?"":v;})
    ].join(",")).join("\n");
    const out=head+"\n"+body;
    navigator.clipboard?.writeText(out);
    return out;
  };
  const[copied,setCopied]=useState(false);

  return(
    <>
      <h2 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:26,fontWeight:900,color:C.lime,margin:"0 0 3px"}}>Analysis</h2>
      <div style={{fontSize:12,color:C.muted,marginBottom:14}}>{rows.length} of {players.length} players</div>

      <SHead>Filter by position</SHead>
      <div style={{display:"flex",gap:5,marginBottom:14,flexWrap:"wrap"}}>
        <Pill active={filt==="all"} onClick={()=>setFilt("all")}>All</Pill>
        {POSITIONS.map(x=><Pill key={x.key} active={filt===x.key} onClick={()=>setFilt(x.key)}>{x.short}</Pill>)}
      </div>

      <SHead>Columns</SHead>
      <div style={{display:"flex",gap:5,marginBottom:14,flexWrap:"wrap"}}>
        {COLS.map(c=>(
          <Pill key={c.key} active={cols.includes(c.key)} onClick={()=>setCols(v=>v.includes(c.key)?v.filter(x=>x!==c.key):[...v,c.key])}>{c.label}</Pill>
        ))}
      </div>

      <Card style={{padding:"6px 10px",overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead>
            <tr>
              <th onClick={()=>{setSortKey("name");setDesc(sortKey==="name"?!desc:false);}}
                style={{textAlign:"left",padding:"8px 4px",color:sortKey==="name"?C.lime:C.muted,fontSize:10,textTransform:"uppercase",letterSpacing:0.5,cursor:"pointer",borderBottom:`1px solid ${C.border}`,position:"sticky",left:0,background:C.card}}>Name</th>
              {active.map(c=>(
                <th key={c.key} onClick={()=>{setSortKey(c.key);setDesc(sortKey===c.key?!desc:false);}}
                  style={{textAlign:"right",padding:"8px 5px",color:sortKey===c.key?C.lime:C.muted,fontSize:10,textTransform:"uppercase",letterSpacing:0.5,cursor:"pointer",borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap"}}>
                  {c.label}{sortKey===c.key?(desc?" ▲":" ▼"):""}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map(p=>(
              <tr key={p.id}>
                <td style={{padding:"8px 4px",borderBottom:`1px solid #202020`,color:C.text,position:"sticky",left:0,background:C.card,whiteSpace:"nowrap"}}>{p.name}</td>
                {active.map(c=>(
                  <td key={c.key} style={{padding:"8px 5px",borderBottom:`1px solid #202020`,textAlign:"right",color:C.soft,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,fontSize:14}}>{c.fmt(c.get(p))}</td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </Card>

      <Ghost onClick={()=>{csv();setCopied(true);setTimeout(()=>setCopied(false),2000);}} style={{width:"100%",textAlign:"center"}}>
        {copied?"✓ Copied — paste into Sheets or Excel":"📋 Copy as spreadsheet (CSV)"}
      </Ghost>

      <div style={{height:16}}/>
      <SHead>Data health</SHead>
      <Card>
        {(()=>{const h=dataHealth(season);
          const items=[
            ["Players with no positions set",h.noPositions,C.red],
            ["Players with no preferred position",h.noPreferred,C.amber],
            ["Players with no TREDS assessment",h.noTreds,C.amber],
            ["Players with no skills rated",h.noSkills,C.amber],
            ["Past events with no register",h.pastNoRegister,C.red],
            ["Future events with no availability",h.futureNoAvail,C.amber],
          ];
          return items.map(([l,n,col])=>(
            <div key={l} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,padding:"7px 0",borderBottom:`1px solid ${C.border}`}}>
              <span style={{fontSize:13,color:n>0?C.text:C.muted}}>{l}</span>
              <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:17,fontWeight:900,color:n>0?col:C.lime,flexShrink:0}}>{n===0?"✓":n}</span>
            </div>
          ));
        })()}
        <p style={{fontSize:11,color:"#444",marginTop:10}}>Gaps are shown rather than filled. An empty rating is honest; a guessed one is not.</p>
      </Card>
    </>
  );
}

function AssessScreen({season,players,updatePlayer,notify,onBack,onOpenPlayer}){
  const DIMS=[
    ...SKILLS.map(x=>({...x,kind:"skill"})),
    ...BEHAVIOURS.map(x=>({...x,kind:"behaviour"})),
  ];
  const[idx,setIdx]=useState(0);
  const[hideRated,setHideRated]=useState(false);
  const d=DIMS[idx];
  const field=d.kind==="skill"?"competence":"behaviour";

  const val=p=>(d.kind==="skill"?p.competence:p.behaviour)?.[d.key]||0;
  const setVal=(p,v)=>updatePlayer(p.id,{[field]:{...(p[field]||{}),[d.key]:val(p)===v?0:v}});

  const sorted=[...players].sort((a,b)=>a.name.localeCompare(b.name));
  const shown=hideRated?sorted.filter(p=>val(p)===0):sorted;
  const done=sorted.filter(p=>val(p)>0).length;

  const snapshotAll=()=>{
    const dt=today();
    players.forEach(pl=>{
      updatePlayer(pl.id,{assessments:[{id:uid(),date:dt,competence:{...pl.competence},behaviour:{...pl.behaviour}},...(pl.assessments||[])]});
    });
    notify(`Snapshot saved for ${players.length} players ✓`);
  };

  return(
    <>
      <Breadcrumb crumbs={[{label:"Players",onClick:onBack},{label:"Rapid Assess"}]}/>

      <Card style={{position:"sticky",top:54,zIndex:80}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginBottom:10}}>
          <button onClick={()=>setIdx(i=>Math.max(0,i-1))} disabled={idx===0}
            style={{padding:"8px 12px",background:"transparent",border:`1px solid ${idx===0?"#222":C.border}`,borderRadius:5,color:idx===0?"#333":C.soft,fontSize:14,cursor:idx===0?"not-allowed":"pointer",fontFamily:"inherit"}}>←</button>
          <div style={{textAlign:"center",minWidth:0,flex:1}}>
            <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:1.5,fontFamily:"'Barlow Condensed',sans-serif"}}>
              {d.kind==="skill"?"Skill":d.group} · {idx+1} of {DIMS.length}
            </div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:700,color:d.kind==="skill"?C.amber:C.blue,lineHeight:1.2}}>{d.label}</div>
          </div>
          <button onClick={()=>setIdx(i=>Math.min(DIMS.length-1,i+1))} disabled={idx===DIMS.length-1}
            style={{padding:"8px 12px",background:idx===DIMS.length-1?"transparent":C.grass,border:`1px solid ${idx===DIMS.length-1?"#222":C.grass}`,borderRadius:5,color:idx===DIMS.length-1?"#333":"#fff",fontSize:14,cursor:idx===DIMS.length-1?"not-allowed":"pointer",fontFamily:"inherit",fontWeight:700}}>→</button>
        </div>
        {d.kind==="behaviour"&&(
          <div style={{display:"flex",justifyContent:"space-between",gap:8,marginBottom:8}}>
            <span style={{fontSize:11,color:"#5a5a5a"}}>1 = {d.low}</span>
            <span style={{fontSize:11,color:"#5a5a5a",textAlign:"right"}}>5 = {d.high}</span>
          </div>
        )}
        <div style={{height:4,background:"#252525",borderRadius:2,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${(done/Math.max(players.length,1))*100}%`,background:C.lime,transition:"width 0.2s"}}/>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:7,gap:8}}>
          <span style={{fontSize:11,color:C.muted}}>{done} of {players.length} rated</span>
          <button onClick={()=>setHideRated(v=>!v)} style={{background:"none",border:"none",color:hideRated?C.lime:C.muted,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>
            {hideRated?"✓ Hiding rated":"Hide already rated"}
          </button>
        </div>
      </Card>

      <Card>
        {shown.length===0&&<p style={{fontSize:13,color:C.muted}}>Everyone rated for this one. Tap → for the next.</p>}
        {shown.map(p=>(
          <div key={p.id} style={{padding:"9px 0",borderBottom:`1px solid ${C.border}`}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:d.kind==="behaviour"?6:0,flexWrap:"wrap"}}>
              <span onClick={()=>onOpenPlayer(p.id)} style={{fontSize:14,cursor:"pointer",minWidth:100,flex:1,color:val(p)>0?C.text:C.soft}}>{p.name}</span>
              {d.kind==="skill"
                ? <Stars value={val(p)} onSet={v=>setVal(p,v)}/>
                : <div style={{flex:1,minWidth:180}}>
                    <div style={{display:"flex",gap:4}}>
                      {[1,2,3,4,5].map(n=>(
                        <button key={n} onClick={()=>setVal(p,n)}
                          style={{flex:1,height:32,borderRadius:4,cursor:"pointer",fontFamily:"inherit",fontSize:13,
                            border:`1px solid ${n<=val(p)?C.blue:"#333"}`,background:n<=val(p)?C.blue:"#212121",color:n<=val(p)?"#fff":"#555"}}>{n}</button>
                      ))}
                    </div>
                  </div>}
            </div>
          </div>
        ))}
      </Card>

      <SHead>When you've finished a pass</SHead>
      <Card>
        <p style={{fontSize:12,color:C.muted,marginBottom:10,lineHeight:1.6}}>
          Saves today's ratings as a dated snapshot for every player, so you can see how the picture moves across the season. Current ratings stay editable.
        </p>
        <Ghost onClick={snapshotAll} style={{width:"100%",textAlign:"center"}}>📌 Snapshot whole squad for {today()}</Ghost>
      </Card>

      <Ghost onClick={onBack} style={{width:"100%",textAlign:"center"}}>← Back to Players</Ghost>
    </>
  );
}

            return(
              <div key={c.key} style={{background:"#161616",border:`1px solid ${short?C.red:C.border}`,borderRadius:8,padding:"10px 12px"}}>
                <div style={{fontSize:13,fontWeight:600,color:C.text}}>{c.label}</div>
                <div style={{fontSize:11,color:C.muted,marginTop:2}}>Needs {c.count} on the pitch</div>
                <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:900,color:col,marginTop:4}}>{c.able} <span style={{fontSize:12,fontWeight:400,color:C.muted}}>can play</span></div>

      <Card>
        {sorted.map(p=>{

            <div key={p.id} onClick={()=>onOpenPlayer(p.id)}

          {counts.map(c=><div key={c.key} style={{textAlign:"center",minWidth:52}}><div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:900,color:c.col}}>{c.n}</div><div style={{fontSize:10,color:C.muted}}>{c.label}</div></div>)}
          {unset>0&&<div style={{textAlign:"center",minWidth:52}}><div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:900,color:"#444"}}>{unset}</div><div style={{fontSize:10,color:C.muted}}>Not set</div></div>}
        </div>
        <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
          <Ghost onClick={()=>setAll("present")}>Mark all present</Ghost>
          <Ghost onClick={()=>setAll("absent")}>Mark all absent</Ghost>
        </div>
        {[...players].sort((a,b)=>a.name.localeCompare(b.name)).map(p=>(
          <div key={p.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,padding:"7px 0",borderBottom:`1px solid ${C.border}`,flexWrap:"wrap"}}>
            <span style={{fontSize:14,minWidth:110,flex:1}}>{p.name}</span>
            <div style={{display:"flex",gap:4}}>
              {ATT_STATES.map(st=>(
                <button key={st.key} onClick={()=>setAtt(p.id,st.key)} title={st.label}
                  style={{width:38,height:32,borderRadius:5,cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:700,
                    background:att[p.id]===st.key?st.col:"#212121",color:att[p.id]===st.key?"#111":"#555",
                    border:`1px solid ${att[p.id]===st.key?st.col:"#333"}`}}>{st.short}</button>
              ))}
            </div>
          </div>
        ))}
        <p style={{fontSize:11,color:"#444",marginTop:10}}>P present · L late · E excused (not counted) · A absent. Tap again to unset.</p>
      </Card>

      {confirmDel
        ? <Card style={{border:`1px solid ${C.red}`}}>
            <p style={{fontSize:13,color:C.soft,marginBottom:12}}>Delete this session and its attendance? Cannot be undone.</p>
            <div style={{display:"flex",gap:10}}>
              <Ghost onClick={()=>setConfirmDel(false)}>Cancel</Ghost>
              <PBtn style={{marginTop:0,flex:1}} color={C.red} onClick={()=>{deleteEvent(event.id);onBack();notify("Session deleted");}}>Delete session</PBtn>
            </div>
          </Card>
        : <Ghost onClick={()=>setConfirmDel(true)} style={{color:C.red,borderColor:C.red}}>Delete this session</Ghost>}
    </>
  );
}

function AttendanceImport({season,players,onApply,onClose,notify}){
  const[raw,setRaw]=useState("");
  const[parsed,setParsed]=useState(null);

  const decode=()=>{
    const d=dec(raw.trim());
    if(!d||d.k!=="attendance"||!Array.isArray(d.present)){notify("Not a valid attendance code","err");return;}
    const present=matchSquad(d.present,players);
    const absent=matchSquad(d.absent||[],players);
    setParsed({date:d.date||today(),title:d.title||"Training",location:d.location||"",present,absent});
  };

  const unmatched=parsed?[...parsed.present,...parsed.absent].filter(x=>!x.player):[];
  const matchedIds=parsed?new Set([...parsed.present,...parsed.absent].filter(x=>x.player).map(x=>x.player.id)):new Set();
  const unmentioned=parsed?players.filter(p=>!matchedIds.has(p.id)):[];

  return(
    <ModalWrap title="Import Attendance" onClose={onClose} wide>
      {!parsed?(
        <>
          <p style={{fontSize:13,color:C.soft,marginBottom:12,lineHeight:1.6}}>
            Paste an attendance code. Nothing is applied until you've seen the preview.
          </p>
          <textarea value={raw} onChange={e=>setRaw(e.target.value)} placeholder="Paste attendance code…"
            style={{background:"#111",border:`1px solid ${C.border}`,borderRadius:6,color:C.text,padding:"8px 11px",fontSize:11,width:"100%",height:120,outline:"none",resize:"none",fontFamily:"monospace",boxSizing:"border-box"}}/>
          <PBtn onClick={decode} disabled={!raw.trim()}>Preview →</PBtn>
        </>
      ):(
        <>
          <div style={{background:"#161616",border:`1px solid ${C.border}`,borderRadius:8,padding:"12px 14px",marginBottom:14}}>
            <div style={{fontSize:15,fontWeight:600,color:C.text}}>{parsed.title}</div>
            <div style={{fontSize:12,color:C.muted,marginTop:2}}>{parsed.date}{parsed.location?` · ${parsed.location}`:""}</div>
          </div>
          <div style={{fontSize:11,color:C.lime,textTransform:"uppercase",letterSpacing:1,marginBottom:6,fontFamily:"'Barlow Condensed',sans-serif"}}>Present ({parsed.present.filter(x=>x.player).length})</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:12}}>
            {parsed.present.filter(x=>x.player).map(x=><span key={x.player.id} style={{background:"#1a3d1a",border:`1px solid ${C.grass}`,borderRadius:5,padding:"3px 9px",fontSize:12,color:C.lime}}>{x.player.name}</span>)}
          </div>
          <div style={{fontSize:11,color:C.red,textTransform:"uppercase",letterSpacing:1,marginBottom:6,fontFamily:"'Barlow Condensed',sans-serif"}}>Absent ({parsed.absent.filter(x=>x.player).length})</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:12}}>
            {parsed.absent.filter(x=>x.player).map(x=><span key={x.player.id} style={{background:"#3a1010",border:`1px solid ${C.red}`,borderRadius:5,padding:"3px 9px",fontSize:12,color:"#ff9999"}}>{x.player.name}</span>)}
          </div>
          {unmatched.length>0&&(
            <div style={{background:"#2a2010",border:`1px solid ${C.amber}`,borderRadius:6,padding:"10px 12px",marginBottom:12}}>
              <div style={{fontSize:12,color:C.amber,fontWeight:700,marginBottom:4}}>⚠ Not matched to anyone in the squad</div>
              <div style={{fontSize:12,color:"#ffe099"}}>{unmatched.map(x=>x.raw).join(", ")}</div>
              <div style={{fontSize:11,color:C.muted,marginTop:4}}>These will be skipped. Add them as players first if they should count.</div>
            </div>
          )}
          {unmentioned.length>0&&(
            <div style={{fontSize:12,color:C.muted,marginBottom:12}}>
              Not mentioned in the code, will be left unset: {unmentioned.map(p=>p.name).join(", ")}
            </div>
          )}
          <div style={{display:"flex",gap:10}}>
            <Ghost onClick={()=>{setParsed(null);setRaw("");}}>← Back</Ghost>
            <PBtn style={{marginTop:0,flex:1}} onClick={()=>{
              const attendance={};
              parsed.present.forEach(x=>{if(x.player)attendance[x.player.id]="present";});
              parsed.absent.forEach(x=>{if(x.player)attendance[x.player.id]="absent";});
              onApply({type:"training",date:parsed.date,title:parsed.title,location:parsed.location,notes:"",attendance});
              onClose();
            }}>Create session →</PBtn>
          </div>
        </>
      )}
    </ModalWrap>
  );
}

function TimelineScreen({season,players,onOpenSession,onAddSession,onImport,onBack}){
  const evs=trainingEvents(season);
  const tourns=[...(season.tournaments||[]),...(season.activeTournament?[season.activeTournament]:[])];
  const items=[
    ...evs.map(e=>({kind:"training",date:e.date,ev:e})),
    ...tourns.map(t=>({kind:"festival",date:t.date,t})),
  ].sort((a,b)=>String(b.date).localeCompare(String(a.date)));

  const squadRate=evs.length?Math.round(players.reduce((a,p)=>a+(attStats(evs,p.id).rate??0),0)/players.length):null;

  return(
    <>
      <Breadcrumb crumbs={[{label:season.name,onClick:onBack},{label:"Timeline"}]}/>
      <div style={{marginBottom:16}}>
        <h2 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:28,fontWeight:900,color:C.lime,margin:0}}>Season Timeline</h2>
        <div style={{fontSize:12,color:C.muted,marginTop:2}}>
          {evs.length} training session{evs.length!==1?"s":""} · {tourns.length} festival{tourns.length!==1?"s":""}

      </div>

      {items.length===0&&<Card><p style={{fontSize:13,color:C.muted}}>Nothing logged yet. Add a training session to start the timeline.</p></Card>}

      {items.map((it,i)=>{
        if(it.kind==="festival"){
          const matches=(it.t.teams||[]).reduce((a,t)=>a+(t.matches||[]).length,(it.t.matches||[]).length);
          return(
            <div key={"t"+i} style={{display:"flex",gap:12,marginBottom:10}}>
              <div style={{width:8,flexShrink:0,display:"flex",flexDirection:"column",alignItems:"center"}}>
                <div style={{width:10,height:10,borderRadius:5,background:C.amber,marginTop:16}}/>
                <div style={{flex:1,width:2,background:C.border}}/>
              </div>
              <div style={{flex:1,background:C.card,border:`1px solid ${C.amber}`,borderRadius:8,padding:14,marginBottom:4}}>
                <div style={{fontSize:11,color:C.amber,textTransform:"uppercase",letterSpacing:1,fontFamily:"'Barlow Condensed',sans-serif"}}>🏉 Festival</div>
                <div style={{fontSize:16,fontWeight:700,fontFamily:"'Barlow Condensed',sans-serif",color:C.text,marginTop:2}}>{it.t.name}</div>
                <div style={{fontSize:12,color:C.muted,marginTop:2}}>{it.date}{it.t.location?` · ${it.t.location}`:""} · {matches} match{matches!==1?"es":""}</div>
              </div>
            </div>
          );
        }
        const e=it.ev;
        const present=players.filter(p=>["present","late"].includes(e.attendance?.[p.id])).length;
        const marked=players.filter(p=>e.attendance?.[p.id]).length;
        return(
          <div key={e.id} style={{display:"flex",gap:12,marginBottom:10}}>
            <div style={{width:8,flexShrink:0,display:"flex",flexDirection:"column",alignItems:"center"}}>
              <div style={{width:10,height:10,borderRadius:5,background:C.grass,marginTop:16}}/>
              <div style={{flex:1,width:2,background:C.border}}/>
            </div>
            <div onClick={()=>onOpenSession(e.id)} style={{flex:1,background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:14,marginBottom:4,cursor:"pointer"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                <div style={{minWidth:0}}>
                  <div style={{fontSize:11,color:C.lime,textTransform:"uppercase",letterSpacing:1,fontFamily:"'Barlow Condensed',sans-serif"}}>Training</div>
                  <div style={{fontSize:16,fontWeight:700,fontFamily:"'Barlow Condensed',sans-serif",color:C.text,marginTop:2}}>{e.title||"Training"}</div>
                  <div style={{fontSize:12,color:C.muted,marginTop:2}}>{e.date}{e.location?` · ${e.location}`:""}</div>
                </div>
                <div style={{textAlign:"right",flexShrink:0}}>
                  <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:900,color:marked?C.lime:"#444"}}>{marked?present:"—"}</div>
                  <div style={{fontSize:10,color:C.muted}}>{marked?"attended":"no register"}</div>
                </div>
              </div>
            </div>
          </div>
        );
      })}
    </>
  );
}


function App(){
  const[season,setSeason]=useState(null);
  const[view,setView]=useState("boot");
  const[toast,setToast]=useState(null);
  const[modals,setModals]=useState({});
  const[importStr,setImportStr]=useState("");
  const[loading,setLoading]=useState(true);
  const[showSaves,setShowSaves]=useState(false);
  const[lastSaved,setLastSaved]=useState(null);
  const[newT,setNewT]=useState({name:"",date:today(),location:"",pitchSize:"",numTeams:1,teamNames:["Team 1","Team 2","Team 3","Team 4"]});
  const[startupSaves,setStartupSaves]=useState([]);const[selPlayerId,setSelPlayerId]=useState(null);const[selEventId,setSelEventId]=useState(null);const[showAttImport,setShowAttImport]=useState(false);const[showMore,setShowMore]=useState(false);
  const[showStartup,setShowStartup]=useState(false);

  useEffect(()=>{
    const saved=lsGet(LS_KEY);const saves=lsGet(LS_SAVES)||[];
    setStartupSaves(saves);
    if(saved?.players){const m=migrateSeason(saved);if(m!==saved)lsSet(LS_KEY,m);setSeason(m);setLastSaved("Restored");if(saves.length>0)setShowStartup(true);else setView("home");}
    else if(saves.length>0){setShowStartup(true);}
    else{setView("setup");}
    setLoading(false);
  },[]);

  const save=useCallback((data)=>{const ok=lsSet(LS_KEY,data);if(ok)setLastSaved(fmtNow());},[]);
  const setS=useCallback((fn)=>{setSeason(prev=>{const next=typeof fn==="function"?fn(prev):{...prev,...fn};save(next);return next;});},[save]);
  const notify=useCallback((msg,type="ok")=>{const id=uid();setToast({msg,type,id});setTimeout(()=>setToast(t=>t?.id===id?null:t),2800);},[]);
  const goTab=(t)=>{
    setSelPlayerId(null);setSelEventId(null);
    if(t==="diary")setView("diary");
    else if(t==="squad")setView("squad");
    else if(t==="analysis")setView("analysis");
    else setView(season?.activeTournament?"tournament":"home");
  };
  const goMore=(k)=>{
    if(k==="saves")setShowSaves(true);
    else if(k==="stats")setView("stats");
    else setModals(m=>({...m,[k]:true}));
  };
  const openM=k=>setModals(m=>({...m,[k]:true}));
  const closeM=k=>setModals(m=>({...m,[k]:false}));

  const handleSeasonStart=({seasonName,pitchSize,playerNames})=>{const s=blankSeason(seasonName,pitchSize,playerNames);setSeason(s);save(s);setView("home");};
  const updatePlayer=(id,patch)=>setS(s=>({...s,players:s.players.map(p=>p.id===id?{...p,...patch}:p)}));
  const addPlayer=(name,isGuest=false)=>{if(!name.trim())return;setS(s=>({...s,players:[...s.players,newPlayer(name.trim(),isGuest)]}));};
  const removePlayer=id=>setS(s=>({...s,players:s.players.filter(p=>p.id!==id),combos:(s.combos||[]).filter(c=>c.a!==id&&c.b!==id)}));
  const addEvent=(ev)=>{const id=uid();setS(s=>({...s,events:[...(s.events||[]),{id,type:"training",date:today(),title:"Training",location:"",notes:"",attendance:{},...ev}]}));return id;};
  const patchEvent=(id,patch)=>setS(s=>({...s,events:(s.events||[]).map(e=>e.id===id?{...e,...patch}:e)}));
  const deleteEvent=(id)=>setS(s=>({...s,events:(s.events||[]).filter(e=>e.id!==id)}));
  const addCombo=(a,b,type,note="")=>setS(s=>{
    const list=s.combos||[];
    if(list.some(c=>((c.a===a&&c.b===b)||(c.a===b&&c.b===a))))return s;
    return{...s,combos:[...list,{id:uid(),a,b,type,note}]};
  });
  const removeCombo=(id)=>setS(s=>({...s,combos:(s.combos||[]).filter(c=>c.id!==id)}));

  const startTournament=()=>{
    if(!newT.name.trim()){notify("Enter a tournament name","err");return;}
    const num=parseInt(newT.numTeams)||1;
    const t=blankTournament(newT.name.trim(),newT.date||today(),newT.location,parseInt(newT.pitchSize)||season.pitchSize,num,newT.teamNames.slice(0,num),season.players);
    setS(s=>({...s,activeTournament:t,players:s.players.map(p=>({...p,recentHalves:0,available:true}))}));
    closeM("newTournament");setNewT({name:"",date:today(),location:"",pitchSize:"",numTeams:1,teamNames:["Team 1","Team 2","Team 3","Team 4"]});
    setView("tournament");notify(`${t.name} started ✓`);
  };

  const archiveTournament=()=>{
    setS(s=>{
      if(!s.activeTournament)return s;
      const rMap={};
      if(s.activeTournament.roster){
        s.activeTournament.roster.forEach(r=>{rMap[r.playerId]=r.tournamentHalves||0;});
      } else if(s.activeTournament.matches){
        s.activeTournament.matches.forEach(m=>{
          if(["halftime","done"].includes(m.status)){(m.firstHalf?.on||[]).forEach(id=>{rMap[id]=(rMap[id]||0)+1;});}
          if(m.status==="done"){(m.secondHalf?.on||[]).forEach(id=>{rMap[id]=(rMap[id]||0)+1;});}
        });
      }
      const archived={...s.activeTournament,status:"archived",playerSnapshot:s.players.map(p=>({id:p.id,name:p.name,seasonHalves:p.seasonHalves+(rMap[p.id]||0)}))};
      return{...s,activeTournament:null,tournaments:[archived,...s.tournaments],players:s.players.map(p=>({...p,seasonHalves:p.seasonHalves+(rMap[p.id]||0),recentHalves:rMap[p.id]||0}))};
    });
    closeM("archiveConfirm");setView("home");notify("Tournament ended ✓");
  };

  const patchTournament=(t)=>setS(s=>({...s,activeTournament:t}));
  const patchMatch=(mid,teamId,patch)=>setS(s=>({...s,activeTournament:{...s.activeTournament,teams:s.activeTournament.teams.map(t=>t.id===teamId?{...t,matches:t.matches.map(m=>m.id===mid?{...m,...patch}:m)}:t)}}));

  const createMatch=(teamId)=>{
    let newId=null;
    setS(s=>{const team=s.activeTournament.teams.find(t=>t.id===teamId);if(!team)return s;const m={id:uid(),num:team.matches.length+1,opposition:"",time:"",pitch:"",status:"setup",score:{us:0,them:0,tries:[]},firstHalf:{on:[],bench:[]},secondHalf:{on:[],bench:[]},changes:[]};newId=m.id;return{...s,activeTournament:{...s.activeTournament,teams:s.activeTournament.teams.map(t=>t.id===teamId?{...t,matches:[...t.matches,m]}:t)}};});
    return newId;
  };

  const autoPick=(mid,teamId,boostIds=[],half="both")=>{
    const t=season.activeTournament;
    const team=t.teams.find(x=>x.id===teamId);if(!team){notify("Team not found","err");return null;}
    const teamRoster=t.roster.filter(r=>r.teamId===teamId&&r.attending&&!r.ill);
    const teamPlayers=teamRoster.map(r=>{const sp=season.players.find(p=>p.id===r.playerId);return sp?{...sp,attending:true,tournamentHalves:r.tournamentHalves??0}:null;}).filter(Boolean);
    if(!teamPlayers.length){notify("No available players","err");return null;}
    const n=t.pitchSize;
    const sorted=fairSortTeam(teamPlayers);
    const boosted=[...sorted.filter(p=>boostIds.includes(p.id)),...sorted.filter(p=>!boostIds.includes(p.id))];
    const fOn=boosted.slice(0,n).map(p=>p.id);
    const fBench=boosted.slice(n).map(p=>p.id);
    const spotsNeeded=Math.max(0,n-fBench.length);
    const sOn=[...fBench,...fOn.slice(fOn.length-spotsNeeded)];
    const sBench=fOn.slice(0,fOn.length-spotsNeeded);
    const patch={};
    if(half===1||half==="both")patch.firstHalf={on:fOn,bench:fBench};
    if(half===2||half==="both")patch.secondHalf={on:sOn,bench:sBench};
    if(half!==2)patch.status="setup";
    patchMatch(mid,teamId,patch);
    return{firstHalf:{on:fOn,bench:fBench},secondHalf:{on:sOn,bench:sBench}};
  };

  const completeHalf=(mid,teamId,half)=>{
    const t=season.activeTournament;
    const team=t.teams.find(x=>x.id===teamId);
    const match=team?.matches.find(x=>x.id===mid);if(!match)return;
    const onIds=half===1?match.firstHalf.on:match.secondHalf.on;
    setS(s=>({...s,activeTournament:{...s.activeTournament,
      roster:s.activeTournament.roster.map(r=>onIds.includes(r.playerId)?{...r,tournamentHalves:(r.tournamentHalves||0)+1}:r),
      teams:s.activeTournament.teams.map(t=>t.id===teamId?{...t,matches:t.matches.map(m=>m.id===mid?{...m,status:half===1?"halftime":"done"}:m)}:t),
    }}));
    notify(half===1?"1st half locked ✓":"Match complete ✓");
  };

  const recordChange=(mid,teamId,half,offId,onId)=>{
    const key=half===1?"firstHalf":"secondHalf";
    setS(s=>{
      const team=s.activeTournament.teams.find(x=>x.id===teamId);
      const match=team?.matches.find(x=>x.id===mid);if(!match)return s;
      const hd={on:[...match[key].on],bench:[...match[key].bench]};
      hd.on=hd.on.filter(id=>id!==offId);if(!hd.on.includes(onId))hd.on.push(onId);
      hd.bench=hd.bench.filter(id=>id!==onId);if(!hd.bench.includes(offId))hd.bench.push(offId);
      return{...s,activeTournament:{...s.activeTournament,
        roster:s.activeTournament.roster.map(r=>r.playerId===onId?{...r,tournamentHalves:(r.tournamentHalves||0)+0.5}:r.playerId===offId?{...r,tournamentHalves:Math.max(0,(r.tournamentHalves||0)-0.5)}:r),
        teams:s.activeTournament.teams.map(t=>t.id===teamId?{...t,matches:t.matches.map(m=>m.id===mid?{...m,[key]:hd,changes:[...m.changes,{half,offId,onId}]}:m)}:t),
      }};
    });
    const pn=id=>season.players.find(p=>p.id===id)?.name??id;
    notify(`${pn(offId)} → ${pn(onId)}`);
  };

  const updateRosterPlayer=(playerId,patch)=>setS(s=>({...s,activeTournament:{...s.activeTournament,roster:s.activeTournament.roster.map(r=>r.playerId===playerId?{...r,...patch}:r)}}));

  const doImport=()=>{const raw=dec(importStr.trim());if(!raw?.players||!raw?.name){notify("Invalid code","err");return;}const p=migrateSeason(raw);setSeason(p);save(p);setView("home");closeM("import");setImportStr("");setLastSaved(fmtNow());notify("Loaded ✓");};
  const handleSavesLoad=(data)=>{const m=migrateSeason(data);setSeason(m);save(m);setView("home");setLastSaved(fmtNow());};
  const fullReset=()=>{const b=blankSeason(season.name,season.pitchSize,season.players.filter(p=>!p.isGuest).map(p=>p.name));setSeason(b);save(b);closeM("resetConfirm");setView("home");notify("Season reset ✓");};
  const startFresh=()=>{lsDel(LS_KEY);const saves=lsGet(LS_SAVES)||[];saves.forEach(s=>lsDel(`clipboard_save_${s.id}`));lsDel(LS_SAVES);setSeason(null);setLastSaved(null);setStartupSaves([]);setShowStartup(false);closeM("startFreshConfirm");setView("setup");notify("All data cleared ✓");};

  const activeTournament=season?.activeTournament;
  const maxS=Math.max(...(season?.players||[]).map(p=>p.seasonHalves),1);
  const maxR=Math.max(...(season?.players||[]).map(p=>p.recentHalves??0),1);

  if(loading)return <div style={{minHeight:"100vh",background:C.night,display:"flex",alignItems:"center",justifyContent:"center",color:C.muted,fontFamily:"sans-serif"}}>Loading…</div>;

  return(
    <div style={{minHeight:"100vh",background:C.night,color:C.text,fontFamily:"'Barlow',sans-serif"}}>
      <style>{` *{box-sizing:border-box;margin:0;padding:0} input,select,textarea,button{font-family:inherit} ::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-thumb{background:#333;border-radius:2px}`}</style>
      <header style={{position:"sticky",top:0,zIndex:100,background:"rgba(13,13,13,0.97)",borderBottom:`1px solid ${C.border}`,backdropFilter:"blur(8px)"}}>
        <div style={{maxWidth:980,margin:"0 auto",padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,flexWrap:"wrap"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,cursor:view!=="setup"?"pointer":"default"}} onClick={()=>view!=="setup"&&setView("home")}>
            <span style={{fontSize:24}}>📋</span>
            <div><div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:700,color:C.lime,letterSpacing:1,lineHeight:1.1}}>{season?.name||"The Clipboard"}</div><div style={{fontSize:10,color:C.muted,letterSpacing:2,textTransform:"uppercase"}}>The Clipboard · v5.0 · diary · squad · analysis</div></div>
          </div>
          {view!=="setup"&&!showStartup&&(
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              {lastSaved&&<span style={{fontSize:10,color:C.muted}}>✓ {lastSaved}</span>}
              <button onClick={()=>setShowMore(true)} style={{padding:"7px 13px",background:"#1f1f1f",border:`1px solid ${C.border}`,borderRadius:18,color:C.soft,fontSize:15,cursor:"pointer",fontFamily:"inherit",lineHeight:1}}>⋯</button>
            </div>
          )}
        </div>
      </header>
      {toast&&<div style={{position:"fixed",top:64,left:"50%",transform:"translateX(-50%)",padding:"9px 22px",borderRadius:6,color:"#fff",zIndex:999,fontSize:14,fontWeight:500,boxShadow:"0 4px 20px rgba(0,0,0,0.5)",whiteSpace:"nowrap",background:toast.type==="err"?C.red:C.grass,pointerEvents:"none"}}>{toast.msg}</div>}
      <main style={{maxWidth:980,margin:"0 auto",padding:"20px 14px 110px"}}>
        {showStartup&&(
          <div style={{display:"flex",justifyContent:"center",paddingTop:20}}>
            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"32px 28px",width:"100%",maxWidth:500}}>
              <div style={{fontSize:36,textAlign:"center",marginBottom:6}}>📋</div>
              <h2 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:28,fontWeight:900,textAlign:"center",color:C.lime,letterSpacing:1,marginBottom:16}}>The Clipboard</h2>
              {season&&<div style={{background:"#1a2a1a",border:`1px solid ${C.grass}`,borderRadius:8,padding:"12px 14px",marginBottom:20}}><div style={{fontSize:12,color:C.lime,fontFamily:"'Barlow Condensed',sans-serif",textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>Auto-saved session</div><div style={{fontSize:15,fontWeight:600,color:C.text}}>{season.name}</div><div style={{fontSize:11,color:C.muted,marginTop:2}}>{season.players.length} players · {season.tournaments.length} archived{season.activeTournament?` · Active: ${season.activeTournament.name}`:""}</div><PBtn style={{marginTop:10}} onClick={()=>{setView("home");setShowStartup(false);}}>Continue →</PBtn></div>}
              {startupSaves.length>0&&<><div style={{fontSize:12,color:C.muted,fontFamily:"'Barlow Condensed',sans-serif",textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Or load a named save</div>{startupSaves.map(slot=><div key={slot.id} style={{background:"#161616",border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 14px",marginBottom:8,display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}><div><div style={{fontSize:14,fontWeight:600,color:C.text}}>{slot.name}</div><div style={{fontSize:11,color:C.muted}}>{slot.seasonName} · {slot.savedAt}</div></div><button onClick={()=>{const data=lsGet(`clipboard_save_${slot.id}`);if(!data?.players){notify("Save not found","err");return;}const m=migrateSeason(data);setSeason(m);save(m);setLastSaved(fmtNow());setView("home");setShowStartup(false);notify(`"${slot.name}" loaded ✓`);}} style={{padding:"6px 14px",background:C.lime,border:"none",borderRadius:5,color:"#111",fontSize:13,fontWeight:700,cursor:"pointer",flexShrink:0}}>Load</button></div>)}</>}
              <div style={{textAlign:"center",marginTop:16}}><button onClick={()=>openM("startFreshConfirm")} style={{background:"none",border:"none",color:C.red,fontSize:13,cursor:"pointer",fontFamily:"inherit",opacity:0.7}}>🗑 Clear everything &amp; start fresh</button></div>
            </div>
          </div>
        )}
        {view==="setup"&&!showStartup&&<SeasonSetupScreen onDone={handleSeasonStart} onLoadSaves={()=>setShowSaves(true)} onImportCode={(str)=>{const raw=dec(str.trim());if(!raw?.players||!raw?.name){notify("Invalid code","err");return;}const p=migrateSeason(raw);setSeason(p);save(p);setView("home");setLastSaved(fmtNow());notify("Session restored ✓");}}/>}
        {view==="home"&&season&&!showStartup&&<SeasonHome season={season} players={season.players} onOpenTournament={()=>setView("tournament")} onNewTournament={()=>openM("newTournament")} onSquad={()=>setView("squad")} onPlayers={()=>{setSelPlayerId(null);setView("players");}} onTimeline={()=>{setSelEventId(null);setView("timeline");}} onSeasonStats={()=>setView("stats")}/>}
        {view==="tournament"&&season&&activeTournament&&<TournamentView tournament={activeTournament} season={season} seasonPlayers={season.players} patchTournament={patchTournament} patchMatch={patchMatch} createMatch={createMatch} completeHalf={completeHalf} recordChange={recordChange} autoPick={autoPick} notify={notify} updateRosterPlayer={updateRosterPlayer} onBack={(dest)=>setView(dest==="home"?"home":"tournament")} onArchive={()=>openM("archiveConfirm")}/>}
        {view==="squadOld"&&season&&<SquadManager season={season} players={season.players} updatePlayer={updatePlayer} addPlayer={addPlayer} removePlayer={removePlayer} onBack={()=>setView("home")} onOpenPlayer={id=>{setSelPlayerId(id);setView("player");}}/>}
        {view==="stats"&&season&&<StatsView season={season} maxS={maxS} maxR={maxR} openM={openM} setView={setView}/>}
        {(view==="squad"||view==="players")&&season&&<SquadScreen season={season} players={season.players} onOpenPlayer={id=>{setSelPlayerId(id);setView("player");}} onAssess={()=>setView("assess")} addPlayer={addPlayer} updatePlayer={updatePlayer} notify={notify}/>}
        {view==="analysis"&&season&&<AnalysisScreen season={season} players={season.players}/>}
        {view==="assess"&&season&&<AssessScreen season={season} players={season.players} updatePlayer={updatePlayer} notify={notify} onOpenPlayer={id=>{setSelPlayerId(id);setView("player");}} onBack={()=>setView("squad")}/>}
        {view==="player"&&season&&(()=>{const pl=season.players.find(x=>x.id===selPlayerId);return pl?<PlayerProfile player={pl} players={season.players} season={season} updatePlayer={updatePlayer} addCombo={addCombo} removeCombo={removeCombo} notify={notify} onBack={()=>{setSelPlayerId(null);setView("squad");}} onOpenPlayer={id=>setSelPlayerId(id)}/>:<SquadScreen season={season} players={season.players} onOpenPlayer={id=>{setSelPlayerId(id);setView("player");}} onAssess={()=>setView("assess")} addPlayer={addPlayer} updatePlayer={updatePlayer} notify={notify}/>;})()}
        {(view==="diary"||view==="timeline")&&season&&<DiaryScreen season={season} players={season.players} onOpenEvent={id=>{setSelEventId(id);setView("event");}} onAddEvent={t=>{const id=addEvent({type:t,title:evType(t).label});setSelEventId(id);setView("event");}} onImport={()=>setShowAttImport(true)} onOpenTournament={t=>{if(t.status==="active")setView("tournament");else setView("stats");}}/>}
        {(view==="event"||view==="session")&&season&&(()=>{const ev=(season.events||[]).find(x=>x.id===selEventId);return ev?<EventScreen event={ev} players={season.players} patchEvent={patchEvent} deleteEvent={deleteEvent} notify={notify} onBack={()=>{setSelEventId(null);setView("diary");}}/>:<DiaryScreen season={season} players={season.players} onOpenEvent={id=>{setSelEventId(id);setView("event");}} onAddEvent={t=>{const id=addEvent({type:t,title:evType(t).label});setSelEventId(id);setView("event");}} onImport={()=>setShowAttImport(true)} onOpenTournament={()=>setView("tournament")}/>;})()}
      </main>
      {modals.newTournament&&(
        <ModalWrap title="New Tournament" onClose={()=>closeM("newTournament")}>
          <Lbl mt={0}>Tournament Name</Lbl><Inp placeholder="e.g. Havant Festival" value={newT.name} onChange={e=>setNewT(t=>({...t,name:e.target.value}))}/>
          <Lbl>Date</Lbl><Inp type="date" value={newT.date} onChange={e=>setNewT(t=>({...t,date:e.target.value}))}/>
          <Lbl>Location (optional)</Lbl><Inp placeholder="e.g. Havant RFC" value={newT.location} onChange={e=>setNewT(t=>({...t,location:e.target.value}))}/>
          <Lbl>Players on pitch per side (blank = default {season?.pitchSize})</Lbl><Inp type="number" style={{width:90}} min={3} max={15} placeholder={season?.pitchSize} value={newT.pitchSize} onChange={e=>setNewT(t=>({...t,pitchSize:e.target.value}))}/>
          <Lbl>Number of teams</Lbl>
          <div style={{display:"flex",gap:8,marginBottom:8}}>{[1,2,3,4].map(n=><button key={n} onClick={()=>setNewT(t=>({...t,numTeams:n}))} style={{padding:"7px 16px",borderRadius:5,border:`1px solid ${newT.numTeams===n?C.lime:"#333"}`,background:newT.numTeams===n?"#1a3a1a":"transparent",color:newT.numTeams===n?C.lime:C.soft,fontSize:14,cursor:"pointer",fontWeight:newT.numTeams===n?700:400}}>{n}</button>)}</div>
          {newT.numTeams>1&&<><Lbl>Team Names</Lbl>{Array.from({length:newT.numTeams},(_,i)=><Inp key={i} style={{marginBottom:6}} placeholder={`Team ${i+1}`} value={newT.teamNames[i]||""} onChange={e=>{const names=[...newT.teamNames];names[i]=e.target.value;setNewT(t=>({...t,teamNames:names}));}}/>)}</>}
          {activeTournament&&<div style={{background:"#3a2010",border:`1px solid ${C.amber}`,borderRadius:6,padding:"8px 12px",fontSize:12,color:"#ffe099",marginTop:12}}>⚠ End the current tournament first.</div>}
          <PBtn onClick={startTournament} disabled={!!activeTournament}>Start Tournament →</PBtn>
          {activeTournament&&<Ghost onClick={()=>{closeM("newTournament");openM("archiveConfirm");}}>End current tournament first</Ghost>}
        </ModalWrap>
      )}
      {modals.archiveConfirm&&(
        <ModalWrap title="End Tournament?" onClose={()=>closeM("archiveConfirm")}>
          <p style={{fontSize:13,color:C.soft,marginBottom:16,lineHeight:1.6}}>This archives <strong style={{color:C.text}}>{activeTournament?.name}</strong> and adds all tournament halves to season totals.</p>
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}><Ghost onClick={()=>closeM("archiveConfirm")}>Cancel</Ghost><PBtn style={{marginTop:0,flex:1}} color={C.amber} onClick={()=>{archiveTournament();setTimeout(()=>openM("newTournament"),300);}}>End &amp; Start New →</PBtn><PBtn style={{marginTop:0,flex:1}} onClick={archiveTournament}>End &amp; Finish</PBtn></div>
        </ModalWrap>
      )}
      {modals.resetConfirm&&(
        <ModalWrap title="Full Season Reset" onClose={()=>closeM("resetConfirm")}>
          <p style={{fontSize:13,color:C.soft,marginBottom:16,lineHeight:1.6}}>Wipes all data. Core squad names kept. Cannot be undone.</p>
          <div style={{display:"flex",gap:10}}><Ghost onClick={()=>closeM("resetConfirm")}>Cancel</Ghost><PBtn style={{marginTop:0,flex:1}} color={C.red} onClick={fullReset}>Reset Everything</PBtn></div>
        </ModalWrap>
      )}
      {modals.startFreshConfirm&&(
        <ModalWrap title="Start Fresh?" onClose={()=>closeM("startFreshConfirm")}>
          <p style={{fontSize:13,color:C.soft,marginBottom:8,lineHeight:1.6}}>This will <strong style={{color:C.red}}>permanently delete all data</strong> — the current season, all tournaments, all named saves, and all game-time records.</p>
          <p style={{fontSize:13,color:C.muted,marginBottom:20,lineHeight:1.6}}>Use <strong style={{color:C.amber}}>Export ↗</strong> or <strong style={{color:C.amber}}>💾 Saves</strong> first if you want a backup.</p>
          <div style={{display:"flex",gap:10}}><Ghost onClick={()=>closeM("startFreshConfirm")} style={{flex:1,textAlign:"center"}}>Cancel</Ghost><PBtn style={{marginTop:0,flex:1}} color={C.red} onClick={startFresh}>🗑 Yes, delete everything</PBtn></div>
        </ModalWrap>
      )}
      {modals.export&&(
        <ModalWrap title="Export Session" onClose={()=>closeM("export")}>
          <p style={{fontSize:13,color:C.soft,marginBottom:12,lineHeight:1.6}}>Copy and send to another coach.</p>
          <textarea readOnly value={enc(season)} onFocus={e=>e.target.select()} style={{background:"#111",border:`1px solid ${C.border}`,borderRadius:6,color:C.text,padding:"8px 11px",fontSize:11,width:"100%",height:130,wordBreak:"break-all",outline:"none",resize:"none",fontFamily:"monospace"}}/>
          <PBtn onClick={()=>{navigator.clipboard?.writeText(enc(season));notify("Copied ✓");}}>Copy to Clipboard</PBtn>
        </ModalWrap>
      )}
      {modals.import&&(
        <ModalWrap title="Import Session" onClose={()=>closeM("import")}>
          <p style={{fontSize:13,color:C.soft,marginBottom:12,lineHeight:1.6}}>Paste a session code from another coach.</p>
          <textarea value={importStr} onChange={e=>setImportStr(e.target.value)} placeholder="Paste code here…" style={{background:"#111",border:`1px solid ${C.border}`,borderRadius:6,color:C.text,padding:"8px 11px",fontSize:11,width:"100%",height:130,outline:"none",resize:"none",fontFamily:"monospace"}}/>
          <PBtn style={{marginTop:12}} onClick={doImport}>Load Session</PBtn>
        </ModalWrap>
      )}
      {showAttImport&&season&&<AttendanceImport season={season} players={season.players} notify={notify} onApply={ev=>{const id=addEvent(ev);setSelEventId(id);setView("session");notify("Session created ✓");}} onClose={()=>setShowAttImport(false)}/>}
      {showMore&&<MoreMenu onClose={()=>setShowMore(false)} go={goMore} season={season} lastSaved={lastSaved}/>}
      {showSaves&&<SavesManager season={season} onLoad={handleSavesLoad} onClose={()=>setShowSaves(false)} notify={notify}/>}
      {season&&view!=="setup"&&!showStartup&&<TabBar view={view} hasTournament={!!activeTournament} setTab={goTab}/>}
    </div>
  );
}


try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  window.__cbMounted = true;
} catch (err) {
  window.__cbFail("The Clipboard hit an error while starting", String(err && err.message ? err.message : err));
}

</script>

<script>
setTimeout(function () {
  if (window.__cbMounted) return;
  var missing = (typeof React === "undefined" || typeof ReactDOM === "undefined" || typeof Babel === "undefined");
  if (missing) {
    window.__cbFail(
      "Could not load the app libraries",
      "React and Babel are fetched from unpkg.com and did not arrive. This is normal in a file preview or offline. " +
      "On the live GitHub Pages URL with a working connection it should load in a second or two."
    );
  } else {
    window.__cbFail(
      "The app libraries loaded but the app did not start",
      "This points at an error in the app code rather than the network. Open the browser console for the exact line."
    );
  }
}, 8000);
</script>
</body>
</html>
