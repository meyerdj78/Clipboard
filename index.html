}

function SessionScreen({event,players,patchEvent,deleteEvent,onBack,notify}){
  const[confirmDel,setConfirmDel]=useState(false);
  const att=event.attendance||{};
  const setAtt=(pid,st)=>patchEvent(event.id,{attendance:{...att,[pid]:att[pid]===st?undefined:st}});
  const setAll=st=>{const a={};players.forEach(p=>{a[p.id]=st;});patchEvent(event.id,{attendance:a});};
  const counts=ATT_STATES.map(s=>({...s,n:players.filter(p=>att[p.id]===s.key).length}));
  const unset=players.filter(p=>!att[p.id]).length;

  return(
    <>
      <Breadcrumb crumbs={[{label:"Timeline",onClick:onBack},{label:event.title||"Training"}]}/>
      <Card>
        <Lbl mt={0}>Title</Lbl>
        <Inp value={event.title} onChange={e=>patchEvent(event.id,{title:e.target.value})}/>
        <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
          <div style={{flex:1,minWidth:140}}><Lbl>Date</Lbl><Inp type="date" value={event.date} onChange={e=>patchEvent(event.id,{date:e.target.value})}/></div>
          <div style={{flex:1,minWidth:140}}><Lbl>Location</Lbl><Inp placeholder="optional" value={event.location||""} onChange={e=>patchEvent(event.id,{location:e.target.value})}/></div>
        </div>
        <Lbl>Session notes</Lbl>
        <textarea value={event.notes||""} onChange={e=>patchEvent(event.id,{notes:e.target.value})}
          placeholder="What you worked on, anything worth remembering…"
          style={{background:"#16233f",border:`1px solid ${C.border}`,borderRadius:6,color:C.text,padding:"10px 12px",fontSize:16,width:"100%",height:80,outline:"none",resize:"vertical",fontFamily:"inherit",boxSizing:"border-box"}}/>
      </Card>

      <SHead>Attendance</SHead>
      <Card>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:12}}>
          {counts.map(c=><div key={c.key} style={{textAlign:"center",minWidth:52}}><div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:900,color:c.col}}>{c.n}</div><div style={{fontSize:10,color:C.muted}}>{c.label}</div></div>)}
          {unset>0&&<div style={{textAlign:"center",minWidth:52}}><div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:900,color:"#8296b2"}}>{unset}</div><div style={{fontSize:10,color:C.muted}}>Not set</div></div>}
        </div>
        <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
          <Ghost onClick={()=>setAll("present")}>Mark all present</Ghost>
          <Ghost onClick={()=>setAll("absent")}>Mark all absent</Ghost>
        </div>
        {[...players].sort((a,b)=>a.name.localeCompare(b.name)).map(p=>(
          <div key={p.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,padding:"7px 0",borderBottom:`1px solid ${C.border}`,flexWrap:"wrap"}}>
            <span style={{fontSize:14,minWidth:110,flex:1}}>{p.name}</span>
            <div style={{display:"flex",gap:4}}>
              {ATT_STATES.map(st=>(
                <button key={st.key} onClick={()=>setAtt(p.id,st.key)} title={st.label}
                  style={{width:38,height:32,borderRadius:5,cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:700,
                    background:att[p.id]===st.key?st.col:"#16233f",color:att[p.id]===st.key?"#111":"#93a4c0",
                    border:`1px solid ${att[p.id]===st.key?st.col:"#35486b"}`}}>{st.short}</button>
              ))}
            </div>
          </div>
        ))}
        <p style={{fontSize:11,color:"#8296b2",marginTop:10}}>P present · L late · E excused (not counted) · A absent. Tap again to unset.</p>
      </Card>

      {confirmDel
        ? <Card style={{border:`1px solid ${C.red}`}}>
            <p style={{fontSize:13,color:C.soft,marginBottom:12}}>Delete this session and its attendance? Cannot be undone.</p>
            <div style={{display:"flex",gap:10}}>
              <Ghost onClick={()=>setConfirmDel(false)}>Cancel</Ghost>
              <PBtn style={{marginTop:0,flex:1}} color={C.red} onClick={()=>{deleteEvent(event.id);onBack();notify("Session deleted");}}>Delete session</PBtn>
            </div>
          </Card>
        : <Ghost onClick={()=>setConfirmDel(true)} style={{color:C.red,borderColor:C.red}}>Delete this session</Ghost>}
    </>
  );
}

function AttendanceImport({season,players,onApply,onClose,notify}){
  const[raw,setRaw]=useState("");
  const[parsed,setParsed]=useState(null);

  const decode=()=>{
    const d=dec(raw.trim());
    if(!d||(d.k!=="attendance"&&d.k!=="availability")){notify("Not a valid import code","err");return;}
    const mode=d.k==="availability"?"availability":"attendance";
    const present=matchSquad(d.present||d.yes||[],players);
    const absent=matchSquad(d.absent||d.no||[],players);
    setParsed({mode,date:d.date||today(),title:d.title||"Training",type:d.type||"training",location:d.location||"",present,absent});
  };

  const existing=parsed?(season.events||[]).find(e=>e.date===parsed.date&&e.type===parsed.type):null;
  const buildPatch=()=>{
    const map={};
    if(parsed.mode==="availability"){
      parsed.present.forEach(x=>{if(x.player)map[x.player.id]="yes";});
      parsed.absent.forEach(x=>{if(x.player)map[x.player.id]="no";});
      return{type:parsed.type,date:parsed.date,title:parsed.title,location:parsed.location,availability:map};
    }
    parsed.present.forEach(x=>{if(x.player)map[x.player.id]="present";});
    parsed.absent.forEach(x=>{if(x.player)map[x.player.id]="absent";});
    return{type:parsed.type,date:parsed.date,title:parsed.title,location:parsed.location,attendance:map};
  };
  const unmatched=parsed?[...parsed.present,...parsed.absent].filter(x=>!x.player):[];
  const matchedIds=parsed?new Set([...parsed.present,...parsed.absent].filter(x=>x.player).map(x=>x.player.id)):new Set();
  const unmentioned=parsed?players.filter(p=>!matchedIds.has(p.id)):[];

  return(
    <ModalWrap title="Import Attendance" onClose={onClose} wide>
      {!parsed?(
        <>
          <p style={{fontSize:13,color:C.soft,marginBottom:12,lineHeight:1.6}}>
            Paste an attendance code. Nothing is applied until you've seen the preview.
          </p>
          <textarea value={raw} onChange={e=>setRaw(e.target.value)} placeholder="Paste attendance code…"
            style={{background:"#0b1424",border:`1px solid ${C.border}`,borderRadius:6,color:C.text,padding:"8px 11px",fontSize:11,width:"100%",height:120,outline:"none",resize:"none",fontFamily:"monospace",boxSizing:"border-box"}}/>
          <PBtn onClick={decode} disabled={!raw.trim()}>Preview →</PBtn>
        </>
      ):(
        <>
          <div style={{background:"#101b33",border:`1px solid ${C.border}`,borderRadius:8,padding:"12px 14px",marginBottom:14}}>
            <div style={{fontSize:15,fontWeight:600,color:C.text}}>{parsed.title}</div>
            <div style={{fontSize:12,color:C.muted,marginTop:2}}>{parsed.date}{parsed.location?` · ${parsed.location}`:""}</div>
          </div>
          <div style={{background:parsed.mode==="availability"?"#10294f":"#16233f",border:`1px solid ${C.border}`,borderRadius:6,padding:"8px 11px",fontSize:12,color:C.soft,marginBottom:12}}>
            {parsed.mode==="availability"
              ?"This will fill in availability for a future session — who has said they can make it."
              :"This will fill in the register — who actually turned up."}
          </div>
          <div style={{fontSize:11,color:C.lime,textTransform:"uppercase",letterSpacing:1,marginBottom:6,fontFamily:"'Barlow Condensed',sans-serif"}}>{parsed.mode==="availability"?"Available":"Present"} ({parsed.present.filter(x=>x.player).length})</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:12}}>
            {parsed.present.filter(x=>x.player).map(x=><span key={x.player.id} style={{background:"#10294f",border:`1px solid ${C.grass}`,borderRadius:5,padding:"3px 9px",fontSize:12,color:C.lime}}>{x.player.name}</span>)}
          </div>
          <div style={{fontSize:11,color:C.red,textTransform:"uppercase",letterSpacing:1,marginBottom:6,fontFamily:"'Barlow Condensed',sans-serif"}}>{parsed.mode==="availability"?"Not available":"Absent"} ({parsed.absent.filter(x=>x.player).length})</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:12}}>
            {parsed.absent.filter(x=>x.player).map(x=><span key={x.player.id} style={{background:"#3d1416",border:`1px solid ${C.red}`,borderRadius:5,padding:"3px 9px",fontSize:12,color:"#ff9999"}}>{x.player.name}</span>)}
          </div>
          {unmatched.length>0&&(
            <div style={{background:"#33260f",border:`1px solid ${C.amber}`,borderRadius:6,padding:"10px 12px",marginBottom:12}}>
              <div style={{fontSize:12,color:C.amber,fontWeight:700,marginBottom:4}}>⚠ Not matched to anyone in the squad</div>
              <div style={{fontSize:12,color:"#ffe099"}}>{unmatched.map(x=>x.raw).join(", ")}</div>
              <div style={{fontSize:11,color:C.muted,marginTop:4}}>These will be skipped. Add them as players first if they should count.</div>
            </div>
          )}
          {unmentioned.length>0&&(
            <div style={{fontSize:12,color:C.muted,marginBottom:12}}>
              Not mentioned in the code, will be left unset: {unmentioned.map(p=>p.name).join(", ")}
            </div>
          )}
          {existing&&(
            <div style={{background:"#33260f",border:`1px solid ${C.amber}`,borderRadius:6,padding:"10px 12px",marginBottom:12}}>
              <div style={{fontSize:12,color:C.amber,fontWeight:700,marginBottom:4}}>⚠ There is already an event on this date</div>
              <div style={{fontSize:12,color:"#ffe099",lineHeight:1.6}}>
                "{existing.title}" — {Object.keys(existing.attendance||{}).length} in the register, {Object.keys(existing.availability||{}).length} availability answers.
                Adding to it keeps everything already recorded and only fills in the players named in this code. Nothing is erased either way.
              </div>
            </div>
          )}
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
            <Ghost onClick={()=>{setParsed(null);setRaw("");}}>← Back</Ghost>
            {existing&&<PBtn style={{marginTop:0,flex:1}} color={C.amber} onClick={()=>{onApply(buildPatch(),existing.id);onClose();}}>Add to "{existing.title}" →</PBtn>}
            <PBtn style={{marginTop:0,flex:1}} onClick={()=>{onApply(buildPatch(),null);onClose();}}>
              {existing?"Create a separate event":`Create ${parsed.mode==="availability"?"event with availability":"register"} →`}
            </PBtn>
          </div>
        </>
      )}
    </ModalWrap>
  );
}

function TimelineScreen({season,players,onOpenSession,onAddSession,onImport,onBack}){
  const evs=trainingEvents(season);
  const tourns=[...(season.tournaments||[]),...(season.activeTournament?[season.activeTournament]:[])];
  const items=[
    ...evs.map(e=>({kind:"training",date:e.date,ev:e})),
    ...tourns.map(t=>({kind:"festival",date:t.date,t})),
  ].sort((a,b)=>String(b.date).localeCompare(String(a.date)));

  const squadRate=evs.length?Math.round(players.reduce((a,p)=>a+(attStats(evs,p.id).rate??0),0)/players.length):null;

  return(
    <>
      <Breadcrumb crumbs={[{label:season.name,onClick:onBack},{label:"Timeline"}]}/>
      <div style={{marginBottom:16}}>
        <h2 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:28,fontWeight:900,color:C.lime,margin:0}}>Season Timeline</h2>
        <div style={{fontSize:12,color:C.muted,marginTop:2}}>
          {evs.length} training session{evs.length!==1?"s":""} · {tourns.length} festival{tourns.length!==1?"s":""}
          {squadRate!==null?` · Squad attendance ${squadRate}%`:""}
        </div>
      </div>

      <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
        <PBtn style={{width:"auto",marginTop:0,padding:"10px 18px"}} onClick={onAddSession}>+ Training Session</PBtn>
        <Ghost onClick={onImport}>📋 Import attendance code</Ghost>
      </div>

      {items.length===0&&<Card><p style={{fontSize:13,color:C.muted}}>Nothing logged yet. Add a training session to start the timeline.</p></Card>}

      {items.map((it,i)=>{
        if(it.kind==="festival"){
          const matches=(it.t.teams||[]).reduce((a,t)=>a+(t.matches||[]).length,(it.t.matches||[]).length);
          return(
            <div key={"t"+i} style={{display:"flex",gap:12,marginBottom:10}}>
              <div style={{width:8,flexShrink:0,display:"flex",flexDirection:"column",alignItems:"center"}}>
                <div style={{width:10,height:10,borderRadius:5,background:C.amber,marginTop:16}}/>
                <div style={{flex:1,width:2,background:C.border}}/>
              </div>
              <div style={{flex:1,background:C.card,border:`1px solid ${C.amber}`,borderRadius:8,padding:14,marginBottom:4}}>
                <div style={{fontSize:11,color:C.amber,textTransform:"uppercase",letterSpacing:1,fontFamily:"'Barlow Condensed',sans-serif"}}>🏉 Festival</div>
                <div style={{fontSize:16,fontWeight:700,fontFamily:"'Barlow Condensed',sans-serif",color:C.text,marginTop:2}}>{it.t.name}</div>
                <div style={{fontSize:12,color:C.muted,marginTop:2}}>{it.date}{it.t.location?` · ${it.t.location}`:""} · {matches} match{matches!==1?"es":""}</div>
              </div>
            </div>
          );
        }
        const e=it.ev;
        const present=players.filter(p=>["present","late"].includes(e.attendance?.[p.id])).length;
        const marked=players.filter(p=>e.attendance?.[p.id]).length;
        return(
          <div key={e.id} style={{display:"flex",gap:12,marginBottom:10}}>
            <div style={{width:8,flexShrink:0,display:"flex",flexDirection:"column",alignItems:"center"}}>
              <div style={{width:10,height:10,borderRadius:5,background:C.grass,marginTop:16}}/>
              <div style={{flex:1,width:2,background:C.border}}/>
            </div>
            <div onClick={()=>onOpenSession(e.id)} style={{flex:1,background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:14,marginBottom:4,cursor:"pointer"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                <div style={{minWidth:0}}>
                  <div style={{fontSize:11,color:C.lime,textTransform:"uppercase",letterSpacing:1,fontFamily:"'Barlow Condensed',sans-serif"}}>Training</div>
                  <div style={{fontSize:16,fontWeight:700,fontFamily:"'Barlow Condensed',sans-serif",color:C.text,marginTop:2}}>{e.title||"Training"}</div>
                  <div style={{fontSize:12,color:C.muted,marginTop:2}}>{e.date}{e.location?` · ${e.location}`:""}</div>
                </div>
                <div style={{textAlign:"right",flexShrink:0}}>
                  <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:900,color:marked?C.lime:"#8296b2"}}>{marked?present:"—"}</div>
                  <div style={{fontSize:10,color:C.muted}}>{marked?"attended":"no register"}</div>
                </div>
              </div>
            </div>
          </div>
        );
      })}
    </>
  );
}


function App(){
  const[season,setSeason]=useState(null);
  const[view,setView]=useState("boot");
  const[toast,setToast]=useState(null);
  const[modals,setModals]=useState({});
  const[importStr,setImportStr]=useState("");
  const[loading,setLoading]=useState(true);
  const[showSaves,setShowSaves]=useState(false);
  const[lastSaved,setLastSaved]=useState(null);
  const[newT,setNewT]=useState({name:"",date:today(),location:"",pitchSize:"",numTeams:1,sourceEventId:null,teamNames:["Team 1","Team 2","Team 3","Team 4"]});
  const[startupSaves,setStartupSaves]=useState([]);const[selPlayerId,setSelPlayerId]=useState(null);const[selEventId,setSelEventId]=useState(null);const[showAttImport,setShowAttImport]=useState(false);const[showMore,setShowMore]=useState(false);const[showExport,setShowExport]=useState(false);const[showSquadImport,setShowSquadImport]=useState(false);const[injuryCtx,setInjuryCtx]=useState(null);
  const[showStartup,setShowStartup]=useState(false);

  useEffect(()=>{
    const saved=lsGet(LS_KEY);const saves=lsGet(LS_SAVES)||[];
    setStartupSaves(saves);
    if(saved?.players){const m=migrateSeason(saved);if(m!==saved)lsSet(LS_KEY,m);setSeason(m);setLastSaved("Restored");if(saves.length>0)setShowStartup(true);else setView("home");}
    else if(saves.length>0){setShowStartup(true);}
    else{setView("setup");}
    setLoading(false);
  },[]);

  const save=useCallback((data)=>{const ok=lsSet(LS_KEY,data);if(ok)setLastSaved(fmtNow());},[]);
  const setS=useCallback((fn)=>{setSeason(prev=>{const next=typeof fn==="function"?fn(prev):{...prev,...fn};save(next);return next;});},[save]);
  const notify=useCallback((msg,type="ok")=>{const id=uid();setToast({msg,type,id});setTimeout(()=>setToast(t=>t?.id===id?null:t),2800);},[]);
  const goTab=(t)=>{
    setSelPlayerId(null);setSelEventId(null);
    if(t==="diary")setView("diary");
    else if(t==="squad")setView("squad");
    else if(t==="analysis")setView("analysis");
    else setView(season?.activeTournament?"tournament":"home");
  };
  const goMore=(k)=>{
    if(k==="quicksave")quickSave();
    else if(k==="saves")setShowSaves(true);
    else if(k==="exportChooser")setShowExport(true);
    else if(k==="injuries")setView("injuries");
    else if(k==="delete")setView("delete");
    else if(k==="squadImport")setShowSquadImport(true);
    else if(k==="stats")setView("stats");
    else setModals(m=>({...m,[k]:true}));
  };
  // Import never destroys: merging keeps every existing entry and only fills in
  // the players named in the code. Returns the id of the event that now holds it.
  const importAttendance=(ev,existingId)=>{
    if(existingId){
      const cur=(season.events||[]).find(e=>e.id===existingId)||{};
      patchEvent(existingId,{
        attendance:{...(cur.attendance||{}),...(ev.attendance||{})},
        availability:{...(cur.availability||{}),...(ev.availability||{})},
      });
      return existingId;
    }
    return addEvent({...ev,attendance:ev.attendance||{},availability:ev.availability||{},notes:""});
  };

  // Merge a squad code by name. Never touches attendance, game time or events.
  const importSquad=(data)=>{
    let updated=0,created=0;
    setS(s=>{
      const norm=t=>String(t||"").toLowerCase().trim();
      let players=[...s.players];
      (data.players||[]).forEach(inc=>{
        const idx=players.findIndex(p=>norm(p.name)===norm(inc.name));
        const fields={positions:inc.positions||[],preferred:inc.preferred||[],primary:inc.primary??null,
          behaviour:inc.behaviour||{},focus:inc.focus||[],notes:inc.notes||"",
          assessments:inc.assessments||[],left:!!inc.left,leftDate:inc.leftDate??null};
        if(idx>=0){players[idx]={...players[idx],...fields};updated++;}
        else{players.push({...newPlayer(inc.name,!!inc.isGuest),...fields});created++;}
      });
      const byName=n=>players.find(p=>norm(p.name)===norm(n));
      const combos=[...(s.combos||[])];
      (data.combos||[]).forEach(c=>{
        const a=byName(c.a),b=byName(c.b);
        if(!a||!b)return;
        if(combos.some(x=>(x.a===a.id&&x.b===b.id)||(x.a===b.id&&x.b===a.id)))return;
        combos.push({id:uid(),a:a.id,b:b.id,type:c.type,note:c.note||""});
      });
      return{...s,players,combos};
    });
    return{updated,created};
  };

  const addInjury=(inj)=>{
    const id=uid();
    setS(s=>{
      const t=s.activeTournament;
      let label="";
      if(inj.context?.matchNum)label=`${t?.name||"Festival"} · match ${inj.context.matchNum}${inj.context.half?`, ${inj.context.half===1?"1st":"2nd"} half`:""}`;
      else if(inj.context?.tournament)label=t?.name||"Festival";
      else if(inj.context?.eventTitle)label=inj.context.eventTitle;
      return{...s,
        injuries:[{id,...inj,contextLabel:label,status:"active",returnDate:null,loggedAt:fmtNow()},...(s.injuries||[])],
        players:inj.removeFromPlay?s.players.map(p=>p.id===inj.playerId?{...p,ill:true,available:false}:p):s.players,
        activeTournament:(inj.removeFromPlay&&s.activeTournament)?{...s.activeTournament,
          roster:(s.activeTournament.roster||[]).map(r=>r.playerId===inj.playerId?{...r,ill:true,attending:false}:r),
          // Pull them off the pitch for anything not already locked. A completed
          // half is history and is left exactly as it was.
          teams:(s.activeTournament.teams||[]).map(tm=>({...tm,matches:(tm.matches||[]).map(m=>{
            if(m.status==="done")return m;
            const drop=h=>({on:(h?.on||[]).filter(x=>x!==inj.playerId),bench:(h?.bench||[]).filter(x=>x!==inj.playerId)});
            const firstLocked=["halftime","second"].includes(m.status);
            return{...m,
              firstHalf:firstLocked?m.firstHalf:drop(m.firstHalf),
              secondHalf:drop(m.secondHalf)};
          })})),
        }:s.activeTournament,
      };
    });
    return id;
  };
  const resolveInjury=(id)=>setS(s=>{
    const inj=(s.injuries||[]).find(i=>i.id===id);
    const stillOut=(s.injuries||[]).some(i=>i.id!==id&&i.status==="active"&&i.playerId===inj?.playerId&&i.removeFromPlay);
    return{...s,
      injuries:(s.injuries||[]).map(i=>i.id===id?{...i,status:"returned",returnDate:today()}:i),
      players:(inj&&!stillOut)?s.players.map(p=>p.id===inj.playerId?{...p,ill:false,available:true}:p):s.players};
  });
  const reopenInjury=(id)=>setS(s=>{
    const inj=(s.injuries||[]).find(i=>i.id===id);
    return{...s,
      injuries:(s.injuries||[]).map(i=>i.id===id?{...i,status:"active",returnDate:null}:i),
      players:(inj&&inj.removeFromPlay)?s.players.map(p=>p.id===inj.playerId?{...p,ill:true,available:false}:p):s.players};
  });

  const deleteMatch=(mid)=>{
    const found=findMatch(season,mid);
    if(!found)return;
    const contrib=matchHalves(found.match);
    const live=found.live;
    setS(s=>{
      const strip=(t)=>({...t,
        teams:(t.teams||[]).map(tm=>tm.id===found.team.id
          ?{...tm,matches:(tm.matches||[]).filter(m=>m.id!==mid).map((m,i)=>({...m,num:i+1}))}
          :tm),
        roster:(t.roster||[]).map(r=>contrib[r.playerId]
          ?{...r,tournamentHalves:Math.max(0,(r.tournamentHalves||0)-contrib[r.playerId])}:r),
      });
      return{...s,
        activeTournament:(live&&s.activeTournament)?strip(s.activeTournament):s.activeTournament,
        tournaments:(s.tournaments||[]).map(t=>t.id===found.tournament.id?strip(t):t),
        // a finished festival has already been added to season totals, so take it back out
        players:live?s.players:s.players.map(p=>contrib[p.id]
          ?{...p,seasonHalves:Math.max(0,p.seasonHalves-contrib[p.id])}:p),
      };
    });
  };

  const deleteFestival=(tid)=>{
    const live=season.activeTournament?.id===tid;
    const t=live?season.activeTournament:(season.tournaments||[]).find(x=>x.id===tid);
    if(!t)return;
    const contrib=tournamentHalvesMap(t);
    setS(s=>({...s,
      activeTournament:live?null:s.activeTournament,
      tournaments:live?s.tournaments:(s.tournaments||[]).filter(x=>x.id!==tid),
      // live festival halves were never added to season totals, so nothing to undo
      players:live?s.players:s.players.map(p=>contrib[p.id]
        ?{...p,seasonHalves:Math.max(0,p.seasonHalves-contrib[p.id])}:p),
      events:(s.events||[]).map(e=>e.tournamentId===tid?{...e,tournamentId:null}:e),
    }));
  };

  const deleteInjury=(iid)=>setS(s=>{
    const inj=(s.injuries||[]).find(i=>i.id===iid);
    const others=(s.injuries||[]).some(i=>i.id!==iid&&i.status==="active"&&i.removeFromPlay&&i.playerId===inj?.playerId);
    return{...s,
      injuries:(s.injuries||[]).filter(i=>i.id!==iid),
      players:(inj&&inj.status==="active"&&inj.removeFromPlay&&!others)
        ?s.players.map(p=>p.id===inj.playerId?{...p,ill:false,available:true}:p):s.players};
  });

  const quickSave=()=>{
    if(!season){notify("Nothing to save yet","err");return;}
    const slots=lsGet(LS_SAVES)||[];
    if(slots.length>=MAX_SLOTS){notify(`All ${MAX_SLOTS} slots full — delete one first`,"err");setShowSaves(true);return;}
    const id=uid();
    if(!lsSet(`clipboard_save_${id}`,season)){notify("Save failed","err");return;}
    const name=`${season.name} — ${fmtNow()}`;
    lsSet(LS_SAVES,[{id,name,savedAt:fmtNow(),seasonName:season.name},...slots]);
    notify("Restore point saved ✓");
  };
  const openM=k=>setModals(m=>({...m,[k]:true}));
  const closeM=k=>setModals(m=>({...m,[k]:false}));

  const handleSeasonStart=({seasonName,pitchSize,playerNames})=>{const s=blankSeason(seasonName,pitchSize,playerNames);setSeason(s);save(s);setView("home");};
  const updatePlayer=(id,patch)=>setS(s=>({...s,players:s.players.map(p=>p.id===id?{...p,...patch}:p)}));
  const addPlayer=(name,isGuest=false)=>{
    if(!name.trim())return;
    const np=newPlayer(name.trim(),isGuest);
    setS(s=>({...s,players:[...s.players,np],
      activeTournament:s.activeTournament?{...s.activeTournament,
        roster:[...(s.activeTournament.roster||[]),{playerId:np.id,attending:true,ill:false,teamId:null,tournamentHalves:0}]}:s.activeTournament}));
    return np.id;
  };
  const removePlayer=id=>setS(s=>{
    const strip=o=>{const c={...(o||{})};delete c[id];return c;};
    const cleanTournament=(t)=>t?{...t,
      roster:(t.roster||[]).filter(r=>r.playerId!==id),
      playerSnapshot:(t.playerSnapshot||[]).filter(x=>x.id!==id),
      teams:(t.teams||[]).map(tm=>({...tm,matches:(tm.matches||[]).map(m=>({...m,
        firstHalf:{on:(m.firstHalf?.on||[]).filter(x=>x!==id),bench:(m.firstHalf?.bench||[]).filter(x=>x!==id)},
        secondHalf:{on:(m.secondHalf?.on||[]).filter(x=>x!==id),bench:(m.secondHalf?.bench||[]).filter(x=>x!==id)},
        score:m.score?{...m.score,tries:(m.score.tries||[]).filter(t2=>t2.playerId!==id)}:m.score,
        changes:(m.changes||[]).filter(ch=>ch.offId!==id&&ch.onId!==id)}))})),
    }:t;
    return{...s,
      players:s.players.filter(p=>p.id!==id),
      combos:(s.combos||[]).filter(c=>c.a!==id&&c.b!==id),
      injuries:(s.injuries||[]).filter(i=>i.playerId!==id),
      events:(s.events||[]).map(e=>({...e,attendance:strip(e.attendance),availability:strip(e.availability)})),
      tournaments:(s.tournaments||[]).map(cleanTournament),
      activeTournament:s.activeTournament?{...s.activeTournament,
        roster:(s.activeTournament.roster||[]).filter(r=>r.playerId!==id),
        teams:(s.activeTournament.teams||[]).map(t=>({...t,matches:(t.matches||[]).map(m=>({...m,
          firstHalf:{on:(m.firstHalf?.on||[]).filter(x=>x!==id),bench:(m.firstHalf?.bench||[]).filter(x=>x!==id)},
          secondHalf:{on:(m.secondHalf?.on||[]).filter(x=>x!==id),bench:(m.secondHalf?.bench||[]).filter(x=>x!==id)},
          score:m.score?{...m.score,tries:(m.score.tries||[]).filter(t2=>t2.playerId!==id)}:m.score,
          changes:(m.changes||[]).filter(ch=>ch.offId!==id&&ch.onId!==id)}))})),
      }:s.activeTournament,
    };
  });
  const setPlayerLeft=(id,left)=>setS(s=>({...s,
    players:s.players.map(p=>p.id===id?{...p,left,leftDate:left?today():null,available:!left,ill:left?false:p.ill}:p),
    activeTournament:s.activeTournament?{...s.activeTournament,
      roster:(s.activeTournament.roster||[]).map(r=>r.playerId===id?{...r,attending:!left}:r)}:s.activeTournament,
  }));
  const addEvent=(ev)=>{const id=uid();setS(s=>({...s,events:[...(s.events||[]),{id,type:"training",date:today(),title:"Training",location:"",notes:"",attendance:{},...ev}]}));return id;};
  const patchEvent=(id,patch)=>setS(s=>({...s,events:(s.events||[]).map(e=>e.id===id?{...e,...patch}:e)}));
  const deleteEvent=(id)=>setS(s=>({...s,events:(s.events||[]).filter(e=>e.id!==id)}));
  const addCombo=(a,b,type,note="")=>setS(s=>{
    const list=s.combos||[];
    if(list.some(c=>((c.a===a&&c.b===b)||(c.a===b&&c.b===a))))return s;
    return{...s,combos:[...list,{id:uid(),a,b,type,note}]};
  });
  const removeCombo=(id)=>setS(s=>({...s,combos:(s.combos||[]).filter(c=>c.id!==id)}));

  const startTournament=()=>{
    if(!newT.name.trim()){notify("Enter a tournament name","err");return;}
    const num=parseInt(newT.numTeams)||1;
    const ev=(season.events||[]).find(e=>e.id===newT.sourceEventId);
    const av=ev?.availability||{};
    const t=blankTournament(newT.name.trim(),newT.date||today(),newT.location,parseInt(newT.pitchSize)||season.pitchSize,num,newT.teamNames.slice(0,num),season.players,av);
    if(newT.sourceEventId)t.eventId=newT.sourceEventId;
    setS(s=>({...s,activeTournament:t,
      players:s.players.map(p=>({...p,recentHalves:0,available:av[p.id]!=="no"})),
      events:(s.events||[]).map(e=>e.id===newT.sourceEventId?{...e,tournamentId:t.id}:e)}));
    closeM("newTournament");setNewT({name:"",date:today(),location:"",pitchSize:"",numTeams:1,sourceEventId:null,teamNames:["Team 1","Team 2","Team 3","Team 4"]});
    setView("tournament");notify(`${t.name} started ✓`);
  };

  const startFromEvent=(ev)=>{
    if(season?.activeTournament){notify("Finish the current festival first","err");openM("archiveConfirm");return;}
    setNewT({name:ev.title||"Festival",date:ev.date||today(),location:ev.location||"",
      pitchSize:"",numTeams:1,sourceEventId:ev.id,teamNames:["Team 1","Team 2","Team 3","Team 4"]});
    openM("newTournament");
  };

  const archiveTournament=()=>{
    setS(s=>{
      if(!s.activeTournament)return s;
      const rMap={};
      if(s.activeTournament.roster){
        s.activeTournament.roster.forEach(r=>{rMap[r.playerId]=r.tournamentHalves||0;});
      } else if(s.activeTournament.matches){
        s.activeTournament.matches.forEach(m=>{
          if(["halftime","done"].includes(m.status)){(m.firstHalf?.on||[]).forEach(id=>{rMap[id]=(rMap[id]||0)+1;});}
          if(m.status==="done"){(m.secondHalf?.on||[]).forEach(id=>{rMap[id]=(rMap[id]||0)+1;});}
        });
      }
      const archived={...s.activeTournament,status:"archived",playerSnapshot:s.players.map(p=>({id:p.id,name:p.name,seasonHalves:p.seasonHalves+(rMap[p.id]||0)}))};
      return{...s,activeTournament:null,tournaments:[archived,...s.tournaments],players:s.players.map(p=>({...p,seasonHalves:p.seasonHalves+(rMap[p.id]||0),recentHalves:rMap[p.id]||0}))};
    });
    closeM("archiveConfirm");setView("home");notify("Festival ended ✓");
  };

  const patchTournament=(t)=>setS(s=>({...s,activeTournament:t}));
  const patchMatch=(mid,teamId,patch)=>setS(s=>({...s,activeTournament:{...s.activeTournament,teams:s.activeTournament.teams.map(t=>t.id===teamId?{...t,matches:t.matches.map(m=>m.id===mid?{...m,...patch}:m)}:t)}}));

  const createMatch=(teamId)=>{
    let newId=null;
    setS(s=>{const team=s.activeTournament.teams.find(t=>t.id===teamId);if(!team)return s;const m={id:uid(),num:team.matches.length+1,opposition:"",time:"",pitch:"",status:"setup",score:{us:0,them:0,tries:[]},firstHalf:{on:[],bench:[]},secondHalf:{on:[],bench:[]},changes:[]};newId=m.id;return{...s,activeTournament:{...s.activeTournament,teams:s.activeTournament.teams.map(t=>t.id===teamId?{...t,matches:[...t.matches,m]}:t)}};});
    return newId;
  };

  const autoPick=(mid,teamId,boostIds=[],half="both")=>{
    const t=season.activeTournament;
    const team=t.teams.find(x=>x.id===teamId);if(!team){notify("Team not found","err");return null;}
    const teamRoster=t.roster.filter(r=>r.teamId===teamId&&r.attending&&!r.ill);
    const teamPlayers=teamRoster.map(r=>{const sp=season.players.find(p=>p.id===r.playerId);return (sp&&!sp.left)?{...sp,attending:true,tournamentHalves:r.tournamentHalves??0}:null;}).filter(Boolean);
    if(!teamPlayers.length){notify("No available players","err");return null;}
    // Never ask for more players than the team actually has, or the second-half
    // split inverts and most of the team ends up benched.
    const n=Math.min(t.pitchSize,teamPlayers.length);
    const sorted=fairSortTeam(teamPlayers);
    const boosted=[...sorted.filter(p=>boostIds.includes(p.id)),...sorted.filter(p=>!boostIds.includes(p.id))];
    const fOn=boosted.slice(0,n).map(p=>p.id);
    const fBench=boosted.slice(n).map(p=>p.id);
    const spotsNeeded=Math.max(0,n-fBench.length);
    // fOn is ordered most-deserving first (fewest halves played). Everyone who sat
    // the first half comes on; the remaining places go to the FRONT of fOn, so the
    // players who sit the second half are the ones who have already played most.
    // Taking from the back would bench whoever has played least, and would do it
    // to the same child every match.
    const sOn=[...fBench,...fOn.slice(0,spotsNeeded)];
    const sBench=fOn.slice(spotsNeeded);
    const patch={};
    if(half===1||half==="both")patch.firstHalf={on:fOn,bench:fBench};
    if(half===2||half==="both")patch.secondHalf={on:sOn,bench:sBench};
    if(half!==2)patch.status="setup";
    patchMatch(mid,teamId,patch);
    return{firstHalf:{on:fOn,bench:fBench},secondHalf:{on:sOn,bench:sBench}};
  };

  const completeHalf=(mid,teamId,half)=>{
    const t=season.activeTournament;
    const team=t.teams.find(x=>x.id===teamId);
    const match=team?.matches.find(x=>x.id===mid);if(!match)return;
    const onIds=half===1?match.firstHalf.on:match.secondHalf.on;
    setS(s=>({...s,activeTournament:{...s.activeTournament,
      roster:s.activeTournament.roster.map(r=>onIds.includes(r.playerId)?{...r,tournamentHalves:(r.tournamentHalves||0)+1}:r),
      teams:s.activeTournament.teams.map(t=>t.id===teamId?{...t,matches:t.matches.map(m=>m.id===mid?{...m,status:half===1?"halftime":"done"}:m)}:t),
    }}));
    notify(half===1?"1st half locked ✓":"Match complete ✓");
  };

  const recordChange=(mid,teamId,half,offId,onId)=>{
    const key=half===1?"firstHalf":"secondHalf";
    setS(s=>{
      const team=s.activeTournament.teams.find(x=>x.id===teamId);
      const match=team?.matches.find(x=>x.id===mid);if(!match)return s;
      const hd={on:[...match[key].on],bench:[...match[key].bench]};
      hd.on=hd.on.filter(id=>id!==offId);if(!hd.on.includes(onId))hd.on.push(onId);
      hd.bench=hd.bench.filter(id=>id!==onId);if(!hd.bench.includes(offId))hd.bench.push(offId);
      return{...s,activeTournament:{...s.activeTournament,
        roster:s.activeTournament.roster.map(r=>r.playerId===onId?{...r,tournamentHalves:(r.tournamentHalves||0)+0.5}:r.playerId===offId?{...r,tournamentHalves:Math.max(0,(r.tournamentHalves||0)-0.5)}:r),
        teams:s.activeTournament.teams.map(t=>t.id===teamId?{...t,matches:t.matches.map(m=>m.id===mid?{...m,[key]:hd,changes:[...m.changes,{half,offId,onId}]}:m)}:t),
      }};
    });
    const pn=id=>season.players.find(p=>p.id===id)?.name??id;
    notify(`${pn(offId)} → ${pn(onId)}`);
  };

  const updateRosterPlayer=(playerId,patch)=>setS(s=>({...s,activeTournament:{...s.activeTournament,roster:s.activeTournament.roster.map(r=>r.playerId===playerId?{...r,...patch}:r)}}));

  const doImport=()=>{const raw=dec(importStr.trim());if(!raw?.players||!raw?.name){notify("Invalid code","err");return;}const p=migrateSeason(raw);setSeason(p);save(p);setView("home");closeM("import");setImportStr("");setLastSaved(fmtNow());notify("Loaded ✓");};
  const handleSavesLoad=(data)=>{const m=migrateSeason(data);setSeason(m);save(m);setView("home");setLastSaved(fmtNow());};
  const fullReset=()=>{const b=blankSeason(season.name,season.pitchSize,season.players.filter(p=>!p.isGuest).map(p=>p.name));setSeason(b);save(b);closeM("resetConfirm");setView("home");notify("Season reset ✓");};
  const startFresh=()=>{lsDel(LS_KEY);const saves=lsGet(LS_SAVES)||[];saves.forEach(s=>lsDel(`clipboard_save_${s.id}`));lsDel(LS_SAVES);setSeason(null);setLastSaved(null);setStartupSaves([]);setShowStartup(false);closeM("startFreshConfirm");setView("setup");notify("All data cleared ✓");};

  const activeTournament=season?.activeTournament;
  const maxS=Math.max(...(season?.players||[]).map(p=>p.seasonHalves),1);
  const maxR=Math.max(...(season?.players||[]).map(p=>p.recentHalves??0),1);

  if(loading)return <div style={{minHeight:"100vh",background:C.night,display:"flex",alignItems:"center",justifyContent:"center",color:C.muted,fontFamily:"sans-serif"}}>Loading…</div>;

  return(
    <div style={{minHeight:"100vh",background:C.night,color:C.text,fontFamily:"'Barlow',sans-serif"}}>
      <style>{` *{box-sizing:border-box;margin:0;padding:0} input,select,textarea,button{font-family:inherit} ::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-thumb{background:#35486b;border-radius:2px}`}</style>
      <header style={{position:"sticky",top:0,zIndex:100,background:"rgba(13,13,13,0.97)",borderBottom:`1px solid ${C.border}`,backdropFilter:"blur(8px)",paddingTop:"env(safe-area-inset-top)"}}>
        <div style={{maxWidth:980,margin:"0 auto",padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,flexWrap:"wrap"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,cursor:view!=="setup"?"pointer":"default"}} onClick={()=>view!=="setup"&&setView("home")}>
            <span style={{fontSize:24}}>📋</span>
            <div><div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:700,color:C.lime,letterSpacing:1,lineHeight:1.1}}>{season?.name||"The Clipboard"}</div><div style={{fontSize:10,color:C.muted,letterSpacing:2,textTransform:"uppercase"}}>v6.5 · backup first</div></div>
          </div>
          {view!=="setup"&&!showStartup&&(
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              {lastSaved&&<span style={{fontSize:10,color:C.muted}}>✓ {lastSaved}</span>}
              <button onClick={()=>setShowMore(true)} style={{padding:"7px 13px",background:"#1a2846",border:`1px solid ${C.border}`,borderRadius:18,color:C.soft,fontSize:15,cursor:"pointer",fontFamily:"inherit",lineHeight:1}}>⋯</button>
            </div>
          )}
        </div>
      </header>
      {toast&&<div style={{position:"fixed",top:"calc(env(safe-area-inset-top) + 64px)",left:"50%",transform:"translateX(-50%)",padding:"9px 22px",borderRadius:6,color:"#fff",zIndex:999,fontSize:14,fontWeight:500,boxShadow:"0 4px 20px rgba(0,0,0,0.5)",whiteSpace:"nowrap",background:toast.type==="err"?C.red:C.grass,pointerEvents:"none"}}>{toast.msg}</div>}
      <main style={{maxWidth:980,margin:"0 auto",padding:"20px 14px 110px"}}>
        {showStartup&&(
          <div style={{display:"flex",justifyContent:"center",paddingTop:20}}>
            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"32px 28px",width:"100%",maxWidth:500}}>
              <div style={{fontSize:36,textAlign:"center",marginBottom:6}}>📋</div>
              <h2 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:28,fontWeight:900,textAlign:"center",color:C.lime,letterSpacing:1,marginBottom:16}}>The Clipboard</h2>
              {season&&<div style={{background:"#10294f",border:`1px solid ${C.grass}`,borderRadius:8,padding:"12px 14px",marginBottom:20}}><div style={{fontSize:12,color:C.lime,fontFamily:"'Barlow Condensed',sans-serif",textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>Auto-saved session</div><div style={{fontSize:15,fontWeight:600,color:C.text}}>{season.name}</div><div style={{fontSize:11,color:C.muted,marginTop:2}}>{season.players.length} players · {season.tournaments.length} archived{season.activeTournament?` · Active: ${season.activeTournament.name}`:""}</div><PBtn style={{marginTop:10}} onClick={()=>{setView("home");setShowStartup(false);}}>Continue →</PBtn></div>}
              {startupSaves.length>0&&<><div style={{fontSize:12,color:C.muted,fontFamily:"'Barlow Condensed',sans-serif",textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Or load a named save</div>{startupSaves.map(slot=><div key={slot.id} style={{background:"#101b33",border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 14px",marginBottom:8,display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}><div><div style={{fontSize:14,fontWeight:600,color:C.text}}>{slot.name}</div><div style={{fontSize:11,color:C.muted}}>{slot.seasonName} · {slot.savedAt}</div></div><button onClick={()=>{const data=lsGet(`clipboard_save_${slot.id}`);if(!data?.players){notify("Save not found","err");return;}const m=migrateSeason(data);setSeason(m);save(m);setLastSaved(fmtNow());setView("home");setShowStartup(false);notify(`"${slot.name}" loaded ✓`);}} style={{padding:"6px 14px",background:C.lime,border:"none",borderRadius:5,color:"#111",fontSize:13,fontWeight:700,cursor:"pointer",flexShrink:0}}>Load</button></div>)}</>}
              <div style={{textAlign:"center",marginTop:16}}><button onClick={()=>openM("startFreshConfirm")} style={{background:"none",border:"none",color:C.red,fontSize:13,cursor:"pointer",fontFamily:"inherit",opacity:0.7}}>🗑 Clear everything &amp; start fresh</button></div>
            </div>
          </div>
        )}
        {view==="setup"&&!showStartup&&<SeasonSetupScreen onDone={handleSeasonStart} onLoadSaves={()=>setShowSaves(true)} onImportCode={(str)=>{const raw=dec(str.trim());if(!raw?.players||!raw?.name){notify("Invalid code","err");return;}const p=migrateSeason(raw);setSeason(p);save(p);setView("home");setLastSaved(fmtNow());notify("Session restored ✓");}}/>}
        {view==="home"&&season&&!showStartup&&<SeasonHome season={season} players={season.players} onOpenTournament={()=>setView("tournament")} onNewTournament={()=>openM("newTournament")} onStartFromEvent={startFromEvent} onSquad={()=>setView("squad")} onPlayers={()=>{setSelPlayerId(null);setView("players");}} onTimeline={()=>{setSelEventId(null);setView("timeline");}} onSeasonStats={()=>setView("stats")}/>}
        {view==="tournament"&&season&&activeTournament&&<TournamentView tournament={activeTournament} season={season} seasonPlayers={season.players} patchTournament={patchTournament} patchMatch={patchMatch} createMatch={createMatch} completeHalf={completeHalf} recordChange={recordChange} autoPick={autoPick} notify={notify} updateRosterPlayer={updateRosterPlayer} onLogInjury={(ctx)=>setInjuryCtx({...ctx,tournament:true})} onBack={(dest)=>setView(dest==="home"?"home":"tournament")} onArchive={()=>openM("archiveConfirm")}/>}
        {view==="squadOld"&&season&&<SquadManager season={season} players={season.players} updatePlayer={updatePlayer} addPlayer={addPlayer} removePlayer={removePlayer} onBack={()=>setView("home")} onOpenPlayer={id=>{setSelPlayerId(id);setView("player");}}/>}
        {view==="stats"&&season&&<StatsView season={season} maxS={maxS} maxR={maxR} openM={openM} setView={setView}/>}
        {(view==="squad"||view==="players")&&season&&<SquadScreen season={season} players={season.players} onOpenPlayer={id=>{setSelPlayerId(id);setView("player");}} onAssess={()=>setView("assess")} addPlayer={addPlayer} updatePlayer={updatePlayer} notify={notify}/>}
        {view==="delete"&&season&&<DeleteScreen season={season} notify={notify} onBack={()=>setView("diary")}
          onBackup={quickSave} onDelete={{event:deleteEvent,match:deleteMatch,festival:deleteFestival,injury:deleteInjury,player:removePlayer}}/>}
        {view==="injuries"&&season&&<InjuriesScreen season={season} resolveInjury={resolveInjury} reopenInjury={reopenInjury}
          onOpenPlayer={id=>{setSelPlayerId(id);setView("player");}} onLog={()=>setInjuryCtx({})}/>}
        {view==="analysis"&&season&&<AnalysisScreen season={season} players={season.players} onOpenPlayer={id=>{setSelPlayerId(id);setView("player");}}/>}
        {view==="assess"&&season&&<AssessScreen season={season} players={season.players} updatePlayer={updatePlayer} notify={notify} onOpenPlayer={id=>{setSelPlayerId(id);setView("player");}} onBack={()=>setView("squad")}/>}
        {view==="player"&&season&&(()=>{const pl=season.players.find(x=>x.id===selPlayerId);return pl?<PlayerProfile player={pl} players={season.players} season={season} updatePlayer={updatePlayer} setPlayerLeft={setPlayerLeft} addCombo={addCombo} removeCombo={removeCombo} notify={notify} onBack={()=>{setSelPlayerId(null);setView("squad");}} onOpenPlayer={id=>setSelPlayerId(id)}/>:<SquadScreen season={season} players={season.players} onOpenPlayer={id=>{setSelPlayerId(id);setView("player");}} onAssess={()=>setView("assess")} addPlayer={addPlayer} updatePlayer={updatePlayer} notify={notify}/>;})()}
        {(view==="diary"||view==="timeline")&&season&&<DiaryScreen season={season} players={season.players} onOpenEvent={id=>{setSelEventId(id);setView("event");}} onAddEvent={t=>{const id=addEvent({type:t,title:evType(t).label});setSelEventId(id);setView("event");}} onImport={()=>setShowAttImport(true)} onOpenTournament={t=>{if(t.status==="active")setView("tournament");else setView("stats");}}/>}
        {(view==="event"||view==="session")&&season&&(()=>{const ev=(season.events||[]).find(x=>x.id===selEventId);return ev?<EventScreen event={ev} players={season.players} patchEvent={patchEvent} deleteEvent={deleteEvent} notify={notify} onStartTournament={startFromEvent} onOpenMatches={()=>setView("tournament")} onExport={()=>setShowExport(true)} onBack={()=>{setSelEventId(null);setView("diary");}}/>:<DiaryScreen season={season} players={season.players} onOpenEvent={id=>{setSelEventId(id);setView("event");}} onAddEvent={t=>{const id=addEvent({type:t,title:evType(t).label});setSelEventId(id);setView("event");}} onImport={()=>setShowAttImport(true)} onOpenTournament={()=>setView("tournament")}/>;})()}
      </main>
      {modals.newTournament&&(
        <ModalWrap title="Set Up Festival" onClose={()=>closeM("newTournament")}>
          <Lbl mt={0}>Festival Name</Lbl><Inp placeholder="e.g. Havant Festival" value={newT.name} onChange={e=>setNewT(t=>({...t,name:e.target.value}))}/>
          <Lbl>Date</Lbl><Inp type="date" value={newT.date} onChange={e=>setNewT(t=>({...t,date:e.target.value}))}/>
          <Lbl>Location (optional)</Lbl><Inp placeholder="e.g. Havant RFC" value={newT.location} onChange={e=>setNewT(t=>({...t,location:e.target.value}))}/>
          <Lbl>Players on pitch per side (blank = default {season?.pitchSize})</Lbl><Inp type="number" style={{width:90}} min={3} max={15} placeholder={season?.pitchSize} value={newT.pitchSize} onChange={e=>setNewT(t=>({...t,pitchSize:e.target.value}))}/>
          <Lbl>Number of teams</Lbl>
          <div style={{display:"flex",gap:8,marginBottom:8}}>{[1,2,3,4].map(n=><button key={n} onClick={()=>setNewT(t=>({...t,numTeams:n}))} style={{padding:"7px 16px",borderRadius:5,border:`1px solid ${newT.numTeams===n?C.lime:"#35486b"}`,background:newT.numTeams===n?"#10294f":"transparent",color:newT.numTeams===n?C.lime:C.soft,fontSize:14,cursor:"pointer",fontWeight:newT.numTeams===n?700:400}}>{n}</button>)}</div>
          {newT.numTeams>1&&<><Lbl>Team Names</Lbl>{Array.from({length:newT.numTeams},(_,i)=><Inp key={i} style={{marginBottom:6}} placeholder={`Team ${i+1}`} value={newT.teamNames[i]||""} onChange={e=>{const names=[...newT.teamNames];names[i]=e.target.value;setNewT(t=>({...t,teamNames:names}));}}/>)}</>}
          {activeTournament&&<div style={{background:"#33260f",border:`1px solid ${C.amber}`,borderRadius:6,padding:"8px 12px",fontSize:12,color:"#ffe099",marginTop:12}}>⚠ Finish the current festival first.</div>}
          <PBtn onClick={startTournament} disabled={!!activeTournament}>Start Festival →</PBtn>
          {activeTournament&&<Ghost onClick={()=>{closeM("newTournament");openM("archiveConfirm");}}>Finish the current festival first</Ghost>}
        </ModalWrap>
      )}
      {modals.archiveConfirm&&(
        <ModalWrap title="End Festival?" onClose={()=>closeM("archiveConfirm")}>
          <p style={{fontSize:13,color:C.soft,marginBottom:16,lineHeight:1.6}}>This archives <strong style={{color:C.text}}>{activeTournament?.name}</strong> and adds all halves played to season totals.</p>
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}><Ghost onClick={()=>closeM("archiveConfirm")}>Cancel</Ghost><PBtn style={{marginTop:0,flex:1}} color={C.amber} onClick={()=>{archiveTournament();setTimeout(()=>openM("newTournament"),300);}}>End &amp; Start New →</PBtn><PBtn style={{marginTop:0,flex:1}} onClick={archiveTournament}>End &amp; Finish</PBtn></div>
        </ModalWrap>
      )}
      {modals.resetConfirm&&(
        <ModalWrap title="Full Season Reset" onClose={()=>closeM("resetConfirm")}>
          <BackupPrompt onBackup={quickSave} notify={notify}/>
      <p style={{fontSize:13,color:C.soft,marginBottom:16,lineHeight:1.6}}>Wipes all data. Core squad names kept. Cannot be undone.</p>
          <div style={{display:"flex",gap:10}}><Ghost onClick={()=>closeM("resetConfirm")}>Cancel</Ghost><PBtn style={{marginTop:0,flex:1}} color={C.red} onClick={fullReset}>Reset Everything</PBtn></div>
        </ModalWrap>
      )}
      {modals.startFreshConfirm&&(
        <ModalWrap title="Start Fresh?" onClose={()=>closeM("startFreshConfirm")}>
          <p style={{fontSize:13,color:C.soft,marginBottom:8,lineHeight:1.6}}>This will <strong style={{color:C.red}}>permanently delete all data</strong> — the current season, all festivals, all named saves, and all game-time records.</p>
          <p style={{fontSize:13,color:C.muted,marginBottom:20,lineHeight:1.6}}>Use <strong style={{color:C.amber}}>Export ↗</strong> or <strong style={{color:C.amber}}>💾 Saves</strong> first if you want a backup.</p>
          <div style={{display:"flex",gap:10}}><Ghost onClick={()=>closeM("startFreshConfirm")} style={{flex:1,textAlign:"center"}}>Cancel</Ghost><PBtn style={{marginTop:0,flex:1}} color={C.red} onClick={startFresh}>🗑 Yes, delete everything</PBtn></div>
        </ModalWrap>
      )}
      {modals.export&&(
        <ModalWrap title="Export Session" onClose={()=>closeM("export")}>
          <p style={{fontSize:13,color:C.soft,marginBottom:12,lineHeight:1.6}}>Copy and send to another coach.</p>
          <textarea readOnly value={enc(season)} onFocus={e=>e.target.select()} style={{background:"#0b1424",border:`1px solid ${C.border}`,borderRadius:6,color:C.text,padding:"8px 11px",fontSize:11,width:"100%",height:130,wordBreak:"break-all",outline:"none",resize:"none",fontFamily:"monospace"}}/>
          <PBtn onClick={()=>{navigator.clipboard?.writeText(enc(season));notify("Copied ✓");}}>Copy to Clipboard</PBtn>
        </ModalWrap>
      )}
      {modals.import&&(
        <ModalWrap title="Import Session" onClose={()=>closeM("import")}>
          <p style={{fontSize:13,color:C.soft,marginBottom:12,lineHeight:1.6}}>Paste a session code from another coach.</p>
          <textarea value={importStr} onChange={e=>setImportStr(e.target.value)} placeholder="Paste code here…" style={{background:"#0b1424",border:`1px solid ${C.border}`,borderRadius:6,color:C.text,padding:"8px 11px",fontSize:11,width:"100%",height:130,outline:"none",resize:"none",fontFamily:"monospace"}}/>
          <PBtn style={{marginTop:12}} onClick={doImport}>Load Session</PBtn>
        </ModalWrap>
      )}
      {showAttImport&&season&&<AttendanceImport season={season} players={season.players} notify={notify} onApply={(ev,existingId)=>{
          const id=importAttendance(ev,existingId);
          setSelEventId(id);setView("event");
          notify(existingId?"Added to the existing event ✓":"Event created ✓");
        }} onClose={()=>setShowAttImport(false)}/>}
      {injuryCtx&&season&&<InjuryModal season={season} players={season.players.filter(p=>!p.left)}
        preselect={injuryCtx.playerId} context={injuryCtx} notify={notify}
        onSave={addInjury} onClose={()=>setInjuryCtx(null)}/>}
      {showExport&&season&&<ExportChooser season={season} notify={notify} onClose={()=>setShowExport(false)}/>}
      {showSquadImport&&season&&<SquadImport season={season} notify={notify} onApply={importSquad} onClose={()=>setShowSquadImport(false)}/>}
      {showMore&&<MoreMenu onClose={()=>setShowMore(false)} go={goMore} season={season} lastSaved={lastSaved}/>}
      {showSaves&&<SavesManager season={season} onLoad={handleSavesLoad} onClose={()=>setShowSaves(false)} notify={notify}/>}
      {season&&view!=="setup"&&!showStartup&&<TabBar view={view} hasTournament={!!activeTournament} setTab={goTab}/>}
    </div>
  );
}


try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  window.__cbMounted = true;
} catch (err) {
  window.__cbFail("The Clipboard hit an error while starting", String(err && err.message ? err.message : err));
}

</script>

<script>
setTimeout(function () {
  if (window.__cbMounted) return;
  var missing = (typeof React === "undefined" || typeof ReactDOM === "undefined" || typeof Babel === "undefined");
  if (missing) {
    window.__cbFail(
      "Could not load the app libraries",
      "React and Babel are fetched from unpkg.com and did not arrive. This is normal in a file preview or offline. " +
      "On the live GitHub Pages URL with a working connection it should load in a second or two."
    );
  } else {
    window.__cbFail(
      "The app libraries loaded but the app did not start",
      "This points at an error in the app code rather than the network. Open the browser console for the exact line."
    );
  }
}, 8000);
</script>
