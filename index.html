  const linked=new Set(existing.map(c=>c.otherId));
  const pool=players.filter(x=>x.id!==player.id&&!linked.has(x.id));
  const tog=id=>setSel(v=>v.includes(id)?v.filter(x=>x!==id):[...v,id]);
  return(
    <ModalWrap title={`Link players with ${player.name}`} onClose={onClose} wide>
      <Lbl mt={0}>Type of pairing</Lbl>
      <div style={{display:"flex",gap:8,marginBottom:6}}>
        <button onClick={()=>setType("good")} style={{flex:1,padding:"10px",borderRadius:6,cursor:"pointer",fontFamily:"inherit",fontSize:14,fontWeight:700,border:`1px solid ${type==="good"?C.grass:"#35486b"}`,background:type==="good"?C.grass:"#16233f",color:type==="good"?"#fff":C.soft}}>🤝 Works well together</button>
        <button onClick={()=>setType("poor")} style={{flex:1,padding:"10px",borderRadius:6,cursor:"pointer",fontFamily:"inherit",fontSize:14,fontWeight:700,border:`1px solid ${type==="poor"?C.red:"#35486b"}`,background:type==="poor"?C.red:"#16233f",color:type==="poor"?"#fff":C.soft}}>⚠ Better apart</button>
      </div>
      <Lbl>Select one or more players</Lbl>
      {pool.length===0&&<p style={{fontSize:13,color:C.muted}}>Everyone else is already linked.</p>}
      <div style={{display:"flex",flexWrap:"wrap",gap:6,maxHeight:230,overflowY:"auto"}}>
        {pool.map(x=>(
          <button key={x.id} onClick={()=>tog(x.id)}
            style={{padding:"7px 13px",borderRadius:5,fontSize:14,cursor:"pointer",fontFamily:"inherit",
              background:sel.includes(x.id)?C.amber:"#1d2b4a",color:sel.includes(x.id)?"#111":C.soft,
              border:`1px solid ${sel.includes(x.id)?C.amber:"#35486b"}`}}>{x.name}</button>
        ))}
      </div>
      <Lbl>Note (optional)</Lbl>
      <Inp placeholder="e.g. good communication at 9 and 10" value={note} onChange={e=>setNote(e.target.value)}/>
      <div style={{display:"flex",gap:10,marginTop:16}}>
        <Ghost onClick={onClose}>Cancel</Ghost>
        <PBtn style={{marginTop:0,flex:1}} disabled={sel.length===0} color={type==="good"?C.grass:C.red}
          onClick={()=>{sel.forEach(id=>onAdd(player.id,id,type,note.trim()));onClose();}}>
          {sel.length===0?"Select at least one player":`Link ${sel.length} player${sel.length>1?"s":""} →`}
        </PBtn>
      </div>
    </ModalWrap>
  );
}

function PlayerProfile({player,players,season,updatePlayer,setPlayerLeft,addCombo,removeCombo,onBack,onOpenPlayer,notify}){
  const[focusTxt,setFocusTxt]=useState("");
  const[picker,setPicker]=useState(false);
  const[openSnap,setOpenSnap]=useState(null);
  const[renaming,setRenaming]=useState(false);
  const[nameTxt,setNameTxt]=useState("");
  const p=player;

  const cyclePos=k=>{
    const has=p.positions.includes(k);
    if(!has){updatePlayer(p.id,{positions:[...p.positions,k]});}
    else if(p.primary!==k){updatePlayer(p.id,{primary:k});}
    else {updatePlayer(p.id,{positions:p.positions.filter(x=>x!==k),primary:null});}
  };
  const setSkill=(k,v)=>updatePlayer(p.id,{competence:{...p.competence,[k]:p.competence?.[k]===v?0:v}});
  const setBeh=(k,v)=>updatePlayer(p.id,{behaviour:{...p.behaviour,[k]:p.behaviour?.[k]===v?0:v}});
  const addFocus=()=>{
    const t=focusTxt.trim();
    if(!t)return;
    if(p.focus.includes(t)){notify("Already on the list","err");setFocusTxt("");return;}
    updatePlayer(p.id,{focus:[...p.focus,t]});setFocusTxt("");
  };
  const snapshot=()=>{
    updatePlayer(p.id,{assessments:[{id:uid(),date:today(),competence:{...p.competence},behaviour:{...p.behaviour}},...(p.assessments||[])]});
    notify("Snapshot saved ✓");
  };

  const rated=SKILLS.map(sk=>({...sk,v:p.competence?.[sk.key]||0})).filter(x=>x.v>0);
  const strengths=rated.length>=4?[...rated].sort((a,b)=>b.v-a.v).filter((x,_,arr)=>x.v===arr[0].v).slice(0,3):[];
  const working=rated.length>=4?[...rated].sort((a,b)=>a.v-b.v).filter((x,_,arr)=>x.v===arr[0].v).slice(0,3):[];
  const combos=combosFor(season,p.id);
  const good=combos.filter(c=>c.type==="good"), poor=combos.filter(c=>c.type==="poor");
  const pname=id=>players.find(x=>x.id===id)?.name??"?";
  const groups=[...new Set(POSITIONS.map(x=>x.group))];
  const behGroups=[...new Set(BEHAVIOURS.map(x=>x.group))];
  const att=attStats(trainingEvents(season),p.id);

  return(
    <>
      <Breadcrumb crumbs={[{label:"Players",onClick:onBack},{label:p.name}]}/>

      <Card>
        {renaming?(
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <Inp value={nameTxt} onChange={e=>setNameTxt(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&nameTxt.trim()){updatePlayer(p.id,{name:nameTxt.trim()});setRenaming(false);notify("Name updated ✓");}}}/>
            <button onClick={()=>{if(nameTxt.trim()){updatePlayer(p.id,{name:nameTxt.trim()});setRenaming(false);notify("Name updated ✓");}}} style={{padding:"8px 13px",background:C.grass,border:"none",borderRadius:6,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",flexShrink:0}}>Save</button>
            <button onClick={()=>{setRenaming(false);setNameTxt(p.name);}} style={{background:"none",border:"none",color:C.muted,fontSize:16,cursor:"pointer",flexShrink:0}}>✕</button>
          </div>
        ):(
          <h2 onClick={()=>{setNameTxt(p.name);setRenaming(true);}} style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:28,fontWeight:900,color:C.lime,margin:0,cursor:"pointer"}}>
            {p.name}{p.isGuest?" 👤":""} <span style={{fontSize:14,color:C.muted}}>✎</span>
          </h2>
        )}
        <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
          <StatChip label="Halves" value={p.seasonHalves}/>
          <StatChip label="Festivals" value={tournamentsAttended(season,p.id)}/>
          <StatChip label="Training" col={att.rate===null?"#8296b2":att.rate>=80?C.lime:att.rate>=50?C.amber:C.red} value={att.rate===null?"—":att.rate+"%"}/>
          <StatChip label="TREDS" col={C.blue} value={tredsScore(p)?tredsScore(p).avg.toFixed(1):"—"}/>
        </div>
        <div style={{fontSize:12,color:C.muted,marginTop:10,lineHeight:1.7,display:"none"}}>
          {p.seasonHalves} halves this season
          {p.primary?` · Primary: ${posLabel(p.primary)}`:""}
          {att.rate!==null?` · Training ${att.rate}% (${att.attended}/${att.counted})`:" · No training logged"}
        </div>
      </Card>

      <SHead>Positions</SHead>
      <Card>
        <p style={{fontSize:12,color:C.muted,marginBottom:12,lineHeight:1.6}}>
          Tap once for <strong style={{color:C.lime}}>can play</strong>, again for <strong style={{color:C.amber}}>primary</strong>, again to clear.
        </p>
        {groups.map(g=>(
          <div key={g} style={{marginBottom:12}}>
            <div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:6,fontFamily:"'Barlow Condensed',sans-serif"}}>{g}</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {POSITIONS.filter(x=>x.group===g).map(x=>{
                const isPrimary=p.primary===x.key, can=p.positions.includes(x.key);
                return(
                  <button key={x.key} onClick={()=>cyclePos(x.key)}
                    style={{padding:"8px 14px",borderRadius:6,fontSize:14,cursor:"pointer",fontFamily:"inherit",
                      background:isPrimary?C.amber:can?C.grass:"#1d2b4a",color:isPrimary?"#111":can?"#fff":C.soft,
                      border:`1px solid ${isPrimary?C.amber:can?C.grass:"#35486b"}`,fontWeight:isPrimary?700:400}}>
                    {x.label}{isPrimary?" ★":""}
                  </button>
                );
              })}
            </div>
          </div>
        ))}
      </Card>

      <SHead>Player's Own Preference</SHead>
      <Card>
        <p style={{fontSize:12,color:C.muted,marginBottom:10,lineHeight:1.6}}>Where <strong style={{color:C.blue}}>they</strong> want to play. Kept separate from your view above — both matter, and they are often different.</p>
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {POSITIONS.map(x=>{
            const on=(p.preferred||[]).includes(x.key);
            return(
              <button key={x.key} onClick={()=>updatePlayer(p.id,{preferred:on?(p.preferred||[]).filter(k=>k!==x.key):[...(p.preferred||[]),x.key]})}
                style={{padding:"8px 14px",borderRadius:6,fontSize:14,cursor:"pointer",fontFamily:"inherit",background:on?C.blue:"#1d2b4a",color:on?"#fff":C.soft,border:`1px solid ${on?C.blue:"#35486b"}`}}>
                {on?"♥ ":""}{x.label}
              </button>
            );
          })}
        </div>
        {(p.preferred||[]).length>0&&!(p.preferred||[]).some(k=>p.positions.includes(k))&&
          <div style={{background:"#33260f",border:`1px solid ${C.amber}`,borderRadius:6,padding:"9px 11px",fontSize:12,color:"#ffe099",marginTop:12}}>
            They want a position you haven't marked them suited to. Worth a conversation about what would need to change.
          </div>}
      </Card>

      <SHead>Availability Ahead</SHead>
      <Card>
        {upcomingUnavailable(season,p.id).length===0
          ? <p style={{fontSize:13,color:C.muted}}>No known absences coming up. Record these on an event in the Diary.</p>
          : <>
              <p style={{fontSize:12,color:C.muted,marginBottom:10,lineHeight:1.6}}>Known absences — factor these in now rather than discovering them on the day.</p>
              {upcomingUnavailable(season,p.id).map(e=>(
                <div key={e.id} style={{display:"flex",justifyContent:"space-between",gap:8,padding:"7px 0",borderBottom:`1px solid ${C.border}`,fontSize:13}}>
                  <span>{evType(e.type).icon} {e.title||evType(e.type).label}</span>
                  <span style={{color:C.red,flexShrink:0}}>{e.date}</span>
                </div>
              ))}
            </>}
      </Card>

      <SHead>Core Values (TREDS)</SHead>
      <Card>
        {behGroups.map(g=>(
          <div key={g} style={{marginBottom:14}}>
            {BEHAVIOURS.filter(x=>x.group===g).map(bh=>(
              <div key={bh.key} style={{marginBottom:12}}>
                <div style={{fontSize:14,marginBottom:5}}>{bh.label}</div>
                <Scale value={p.behaviour?.[bh.key]||0} onSet={v=>setBeh(bh.key,v)} low={bh.low} high={bh.high}/>
              </div>
            ))}
          </div>
        ))}
        <p style={{fontSize:11,color:"#8296b2"}}>Teamwork · Respect · Enjoyment · Discipline · Sportsmanship — England Rugby's core values. Tap the same number again to clear.</p>
      </Card>

      <SHead>Combinations</SHead>
      <Card>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:11,color:C.lime,textTransform:"uppercase",letterSpacing:1,marginBottom:6,fontFamily:"'Barlow Condensed',sans-serif"}}>🤝 Works well with</div>
          {good.length===0&&<p style={{fontSize:13,color:C.muted}}>None recorded.</p>}
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {good.map(c=>(
              <div key={c.id} style={{display:"inline-flex",alignItems:"center",gap:6,background:"#10294f",border:`1px solid ${C.grass}`,borderRadius:5,padding:"5px 10px",fontSize:13,color:C.lime}}>
                <span onClick={()=>onOpenPlayer(c.otherId)} style={{cursor:"pointer"}}>{pname(c.otherId)}</span>
                {c.note&&<span style={{fontSize:11,color:C.soft,opacity:0.95}}>— {c.note}</span>}
                <button onClick={()=>removeCombo(c.id)} style={{background:"none",border:"none",color:"#5b84c4",cursor:"pointer",fontSize:12}}>✕</button>
              </div>
            ))}
          </div>
        </div>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:11,color:C.red,textTransform:"uppercase",letterSpacing:1,marginBottom:6,fontFamily:"'Barlow Condensed',sans-serif"}}>⚠ Better apart</div>
          {poor.length===0&&<p style={{fontSize:13,color:C.muted}}>None recorded.</p>}
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {poor.map(c=>(
              <div key={c.id} style={{display:"inline-flex",alignItems:"center",gap:6,background:"#3d1416",border:`1px solid ${C.red}`,borderRadius:5,padding:"5px 10px",fontSize:13,color:"#ff9999"}}>
                <span onClick={()=>onOpenPlayer(c.otherId)} style={{cursor:"pointer"}}>{pname(c.otherId)}</span>
                {c.note&&<span style={{fontSize:11,color:C.soft,opacity:0.95}}>— {c.note}</span>}
                <button onClick={()=>removeCombo(c.id)} style={{background:"none",border:"none",color:"#a8615a",cursor:"pointer",fontSize:12}}>✕</button>
              </div>
            ))}
          </div>
        </div>
        <Ghost onClick={()=>setPicker(true)} style={{width:"100%",textAlign:"center"}}>+ Link players</Ghost>
        <p style={{fontSize:11,color:"#8296b2",marginTop:8}}>Pairings are stored once and appear on both players' profiles.</p>
      </Card>

      <SHead>Development Focus</SHead>
      <Card>
        <div style={{display:"flex",gap:6,marginBottom:12}}>
          <Inp placeholder="e.g. Tackle technique — head position" value={focusTxt}
            onChange={e=>setFocusTxt(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addFocus();}}/>
          <button onClick={addFocus} style={{padding:"8px 14px",background:C.grass,border:"none",borderRadius:6,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",flexShrink:0}}>Add</button>
        </div>
        {p.focus.length===0&&<p style={{fontSize:13,color:C.muted}}>Nothing recorded yet.</p>}
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {p.focus.map(t=>(
            <div key={t} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,background:"#1d2b4a",border:"1px solid #35486b",borderRadius:6,padding:"8px 12px"}}>
              <span style={{fontSize:13,color:C.text}}>🎯 {t}</span>
              <button onClick={()=>updatePlayer(p.id,{focus:p.focus.filter(x=>x!==t)})} style={{background:"none",border:"none",color:"#93a4c0",cursor:"pointer",fontSize:14,flexShrink:0}}>✕</button>
            </div>
          ))}
        </div>
      </Card>

      <SHead>Coach Notes</SHead>
      <Card>
        <textarea value={p.notes} onChange={e=>updatePlayer(p.id,{notes:e.target.value})}
          placeholder="Anything worth remembering — what motivates them, what to watch for…"
          style={{background:"#16233f",border:`1px solid ${C.border}`,borderRadius:6,color:C.text,padding:"10px 12px",fontSize:16,width:"100%",height:110,outline:"none",resize:"vertical",fontFamily:"inherit",boxSizing:"border-box",lineHeight:1.5}}/>
      </Card>

      <SHead>Assessment History</SHead>
      <Card>
        <p style={{fontSize:12,color:C.muted,marginBottom:10,lineHeight:1.6}}>Save a dated snapshot to see how the picture changes across the season. Current ratings stay editable.</p>
        <Ghost onClick={snapshot} style={{width:"100%",textAlign:"center",marginBottom:10}}>📌 Save snapshot for {today()}</Ghost>
        {(p.assessments||[]).length===0&&<p style={{fontSize:13,color:C.muted}}>No snapshots yet.</p>}
        {(p.assessments||[]).map(a=>(
          <div key={a.id} style={{borderBottom:`1px solid ${C.border}`,padding:"9px 0"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
              <button onClick={()=>setOpenSnap(openSnap===a.id?null:a.id)} style={{background:"none",border:"none",color:C.text,fontSize:14,cursor:"pointer",fontFamily:"inherit",padding:0}}>
                {openSnap===a.id?"▾":"▸"} {a.date}
              </button>
              <button onClick={()=>updatePlayer(p.id,{assessments:p.assessments.filter(x=>x.id!==a.id)})} style={{background:"none",border:"none",color:"#93a4c0",cursor:"pointer",fontSize:12}}>Delete</button>
            </div>
            {openSnap===a.id&&(
              <div style={{marginTop:8,fontSize:12,color:C.soft,lineHeight:1.8}}>
                {BEHAVIOURS.filter(bh=>a.behaviour?.[bh.key]>0).map(bh=>(
                  <div key={bh.key}>{bh.label}: <span style={{color:C.blue}}>{a.behaviour[bh.key]}/5</span></div>
                ))}
              </div>
            )}
          </div>
        ))}
      </Card>

      <SHead>Injuries</SHead>
      <Card>
        <InjuryList season={season} injuries={injuriesFor(season,p.id)} compact/>
      </Card>

      <SHead>Squad Status</SHead>
      <Card>
        {p.left
          ? <>
              <p style={{fontSize:13,color:C.soft,marginBottom:12,lineHeight:1.6}}>Left the club{p.leftDate?` on ${p.leftDate}`:""}. Their history is kept and they are excluded from selection.</p>
              <PBtn style={{marginTop:0}} onClick={()=>{setPlayerLeft(p.id,false);notify("Back in the squad ✓");}}>Rejoined the club</PBtn>
            </>
          : <>
              <p style={{fontSize:13,color:C.soft,marginBottom:12,lineHeight:1.6}}>If they leave mid-season, mark them as left rather than deleting. Attendance and assessments stay on record, they drop out of selection and the squad list.</p>
              <Ghost onClick={()=>{setPlayerLeft(p.id,true);notify(`${p.name} marked as left`);}} style={{width:"100%",textAlign:"center",color:C.amber,borderColor:C.amber}}>Mark as left the club</Ghost>
            </>}
      </Card>

      <Ghost onClick={onBack} style={{width:"100%",textAlign:"center"}}>← Back to Players</Ghost>
      {picker&&<ComboPicker player={p} players={players} existing={combos} onAdd={addCombo} onClose={()=>setPicker(false)}/>}
    </>
  );
}

function StatChip({label,value,col,onClick,active}){
  return(
    <div onClick={onClick} style={{background:active?"#10294f":"#101b33",border:`1px solid ${active?(col||C.lime):C.border}`,borderRadius:8,padding:"8px 10px",textAlign:"center",minWidth:64,flex:1,cursor:onClick?"pointer":"default"}}>
      <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:900,color:col||C.text,lineHeight:1.1}}>{value}</div>
      <div style={{fontSize:10,color:C.muted,marginTop:2}}>{label}</div>
    </div>
  );
}

function CodeModal({title,subtitle,code,onClose,notify,plain}){
  return(
    <ModalWrap title={title} onClose={onClose} wide>
      {subtitle&&<p style={{fontSize:13,color:C.soft,marginBottom:12,lineHeight:1.6}}>{subtitle}</p>}
      <textarea readOnly value={code} onFocus={e=>e.target.select()}
        style={{background:"#0b1424",border:`1px solid ${C.border}`,borderRadius:6,color:C.text,padding:"9px 11px",
          fontSize:11,width:"100%",height:plain?220:150,wordBreak:"break-all",outline:"none",resize:"vertical",
          fontFamily:"monospace",boxSizing:"border-box",lineHeight:1.45}}/>
      <div style={{fontSize:11,color:"#8296b2",marginTop:6}}>{code.length.toLocaleString()} characters</div>
      <PBtn onClick={()=>{navigator.clipboard?.writeText(code);notify("Copied ✓");}}>Copy to clipboard</PBtn>
    </ModalWrap>
  );
}

function ExportChooser({season,onClose,notify}){
  const[show,setShow]=useState(null);
  const evs=[...(season.events||[])].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const tours=[...(season.tournaments||[]),...(season.activeTournament?[season.activeTournament]:[])];

  if(show) return <CodeModal {...show} notify={notify} onClose={()=>setShow(null)}/>;

  const Item=({icon,label,sub,onClick})=>(
    <button onClick={onClick} style={{display:"flex",alignItems:"center",gap:12,width:"100%",padding:"13px 4px",
      background:"none",border:"none",borderBottom:`1px solid ${C.border}`,cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>
      <span style={{fontSize:18,width:24,flexShrink:0}}>{icon}</span>
      <span style={{flex:1,minWidth:0}}>
        <span style={{display:"block",fontSize:15,color:C.text}}>{label}</span>
        <span style={{display:"block",fontSize:11,color:C.muted,marginTop:1}}>{sub}</span>
      </span>
      <span style={{color:C.muted,fontSize:16}}>›</span>
    </button>
  );

  return(
    <ModalWrap title="Export a Code" onClose={onClose} wide>
      <p style={{fontSize:12,color:C.muted,marginBottom:14,lineHeight:1.6}}>
        Codes contain player names. Keep them in a note or an email — never in the public repository.
      </p>
      <Item icon="📦" label="Everything" sub="The whole season — the complete backup"
        onClick={()=>setShow({title:"Whole Season",code:enc(season),
          subtitle:"Restores everything exactly as it is now. Paste into ⋯ → Import."})}/>
      <Item icon="👥" label="Squad &amp; assessments" sub={`${(season.players||[]).length} players, positions, TREDS, notes, combinations`}
        onClick={()=>setShow({title:"Squad & Assessments",code:squadCode(season),
          subtitle:"Player records only — no attendance, no game time. Merges into any season by name, so it also carries the squad forward to next season."})}/>
      <div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,margin:"16px 0 8px",fontFamily:"'Barlow Condensed',sans-serif"}}>A single event</div>
      {evs.length===0&&<p style={{fontSize:13,color:C.muted}}>Nothing in the Diary yet.</p>}
      <div style={{maxHeight:200,overflowY:"auto"}}>
        {evs.map(e=>(
          <Item key={e.id} icon={evType(e.type).icon} label={e.title||evType(e.type).label}
            sub={`${e.date} · ${Object.keys(e.attendance||{}).length} in register, ${Object.keys(e.availability||{}).length} availability`}
            onClick={()=>setShow({title:e.title||"Event",code:eventCode(season,e),
              subtitle:"Register and availability for this one event. Importing it adds to a matching event rather than replacing it."})}/>
        ))}
      </div>
      {tours.length>0&&<>
        <div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,margin:"16px 0 8px",fontFamily:"'Barlow Condensed',sans-serif"}}>Festival record (readable text)</div>
        {tours.map(t=>(
          <Item key={t.id} icon="🏉" label={t.name} sub={`${t.date} · scores, tries, changes, game time`}
            onClick={()=>setShow({title:t.name,code:festivalRecord(season,t),plain:true,
              subtitle:"A written record to keep or paste into a report. This is not a code and cannot be imported — the whole-season export already contains the festival."})}/>
        ))}
      </>}
    </ModalWrap>
  );
}

function SquadImport({season,onApply,onClose,notify}){
  const[raw,setRaw]=useState("");
  const[parsed,setParsed]=useState(null);
  const decode=()=>{
    const n=normaliseImport(dec(raw.trim()));
    if(!n||n.kind!=="squad"){notify("Not a squad code","err");return;}
    setParsed(n.data);
  };
  const matched=parsed?matchSquad(parsed.players.map(p=>p.name),season.players):[];
  const known=matched.filter(m=>m.player).length;
  const fresh=matched.filter(m=>!m.player).length;
  return(
    <ModalWrap title="Import Squad" onClose={onClose} wide>
      {!parsed?(
        <>
          <p style={{fontSize:13,color:C.soft,marginBottom:12,lineHeight:1.6}}>Paste a squad code. Nothing changes until you have seen the preview.</p>
          <textarea value={raw} onChange={e=>setRaw(e.target.value)} placeholder="Paste squad code…"
            style={{background:"#0b1424",border:`1px solid ${C.border}`,borderRadius:6,color:C.text,padding:"8px 11px",fontSize:11,width:"100%",height:130,outline:"none",resize:"none",fontFamily:"monospace",boxSizing:"border-box"}}/>
          <PBtn onClick={decode} disabled={!raw.trim()}>Preview →</PBtn>
        </>
      ):(
        <>
          <div style={{background:"#101b33",border:`1px solid ${C.border}`,borderRadius:8,padding:"12px 14px",marginBottom:14}}>
            <div style={{fontSize:15,fontWeight:600,color:C.text}}>{parsed.season||"Squad"}</div>
            <div style={{fontSize:12,color:C.muted,marginTop:2}}>Exported {parsed.exported||"—"} · {parsed.players.length} players</div>
          </div>
          <div style={{fontSize:13,color:C.soft,lineHeight:1.8,marginBottom:14}}>
            <div><span style={{color:C.lime,fontWeight:700}}>{known}</span> already in your squad — positions, TREDS, focus and notes will be updated</div>
            <div><span style={{color:C.blue,fontWeight:700}}>{fresh}</span> not in your squad — will be added as new players</div>
            <div style={{color:C.muted,fontSize:12,marginTop:6}}>Attendance and game time are untouched. Anyone in your squad who is not in this code is left exactly as they are.</div>
          </div>
          <div style={{display:"flex",gap:10}}>
            <Ghost onClick={()=>{setParsed(null);setRaw("");}}>← Back</Ghost>
            <PBtn style={{marginTop:0,flex:1}} onClick={()=>{const r=onApply(parsed);onClose();notify(`${r.updated} updated, ${r.created} added ✓`);}}>Apply →</PBtn>
          </div>
        </>
      )}
    </ModalWrap>
  );
}

function InjuryModal({season,players,preselect,context,onSave,onClose,notify}){

  const[type,setType]=useState("knock");
  const[note,setNote]=useState("");
  const[remove,setRemove]=useState(false);
  const[date,setDate]=useState(today());
  const t=INJURY_TYPES.find(x=>x.key===type);

  const chooseType=(k)=>{
    setType(k);
    const def=INJURY_TYPES.find(x=>x.key===k);
    setRemove(!!def?.remove);
  };

  return(
    <ModalWrap title="Log an Injury" onClose={onClose} wide>
      <Lbl mt={0}>Player</Lbl>
      <select value={pid} onChange={e=>setPid(e.target.value)}
        style={{background:"#16233f",border:`1px solid ${C.border}`,borderRadius:6,color:C.text,padding:"9px 11px",fontSize:16,width:"100%",outline:"none"}}>
        <option value="">Select player…</option>
        {[...players].sort((a,b)=>a.name.localeCompare(b.name)).map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
      </select>

      <Lbl>What happened</Lbl>
      <div style={{display:"flex",flexDirection:"column",gap:5}}>
        {INJURY_TYPES.map(x=>(
          <button key={x.key} onClick={()=>chooseType(x.key)}
            style={{padding:"10px 12px",borderRadius:6,cursor:"pointer",fontFamily:"inherit",fontSize:14,textAlign:"left",
              border:`1px solid ${type===x.key?(x.head?C.red:C.lime):"#35486b"}`,
              background:type===x.key?(x.head?"#3d1416":"#10294f"):"#16233f",
              color:type===x.key?(x.head?"#ff9999":C.lime):C.soft,fontWeight:type===x.key?700:400}}>
            {x.head?"⚠ ":""}{x.label}
          </button>
        ))}
      </div>
      {isHeadInjury(type)&&<HeadInjuryNotice/>}

      <Lbl>Date</Lbl>
      <Inp type="date" value={date} onChange={e=>setDate(e.target.value)}/>

      <Lbl>Note</Lbl>
      <Inp placeholder="e.g. rolled ankle in a tackle, walked off" value={note} onChange={e=>setNote(e.target.value)}/>

      <div onClick={()=>setRemove(v=>!v)} style={{display:"flex",alignItems:"center",gap:10,marginTop:14,cursor:"pointer"}}>
        <div style={{width:24,height:24,borderRadius:5,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",
          background:remove?C.red:"#16233f",border:`1px solid ${remove?C.red:"#35486b"}`,color:"#fff",fontSize:14}}>{remove?"✓":""}</div>
        <span style={{fontSize:14,color:C.text}}>Take them out of selection now</span>
      </div>
      {isHeadInjury(type)&&!remove&&
        <div style={{fontSize:12,color:"#ff9999",marginTop:8}}>A suspected concussion means removal. Please tick this.</div>}

      <div style={{display:"flex",gap:10,marginTop:18}}>
        <Ghost onClick={onClose}>Cancel</Ghost>
        <PBtn style={{marginTop:0,flex:1}} color={isHeadInjury(type)?C.red:C.grass}
          disabled={!pid||(type==="concussion"&&!remove)}
          onClick={()=>{
            onSave({playerId:pid,type,note:note.trim(),date,removeFromPlay:remove,context:context||{}});
            onClose();
            notify("Injury logged");
          }}>{!pid?"Select a player":"Log injury"}</PBtn>
      </div>
    </ModalWrap>
  );
}

  return(
    <>
      {injuries.map(inj=>{
        const head=isHeadInjury(inj.type);
        const days=daysSince(inj.date);
        const earliest=head?grasEarliest(inj.date):null;
        return(
          <div key={inj.id} style={{borderBottom:`1px solid ${C.border}`,padding:"11px 0"}}>
            <div style={{display:"flex",justifyContent:"space-between",gap:8,alignItems:"flex-start"}}>

                  {nm(inj.playerId)}

                  {inj.date}{days!==null&&inj.status==="active"?` · ${days} day${days!==1?"s":""} ago`:""}
                  {inj.contextLabel?` · ${inj.contextLabel}`:""}
                </div>
                {inj.note&&<div style={{fontSize:12,color:C.soft,marginTop:4}}>{inj.note}</div>}
                {head&&inj.status==="active"&&(
                  <div style={{fontSize:11,color:C.amber,marginTop:5,lineHeight:1.6}}>
                    Earliest possible return under GRAS: <strong>{earliest}</strong> ({GRAS_MIN_DAYS} days).

function BackupPrompt({onBackup,notify,tone}){
  const[tick,setTick]=useState(0);
  const slots=lsGet(LS_SAVES)||[];
  const last=slots[0];
  const today_=today();
  // savedAt looks like "21:23 12 Sep" — good enough to spot one made today
  const d=new Date();
  const stamp=`${String(d.getDate()).padStart(2,"0")} ${d.toLocaleDateString("en-GB",{month:"short"})}`;
  const freshToday=!!last&&String(last.savedAt||"").includes(stamp);
  const col=freshToday?C.grass:C.amber;
  return(
    <div style={{background:freshToday?"#10294f":"#33260f",border:`1px solid ${col}`,borderRadius:8,padding:"11px 13px",marginBottom:tone==="inline"?10:16}}>
      <div style={{fontSize:12,color:freshToday?C.soft:"#ffe099",lineHeight:1.6,marginBottom:8}}>
        {freshToday
          ? <>Backed up today — last restore point {last.savedAt}. There is still no undo, so check what you are deleting.</>
          : last
            ? <>Last restore point was {last.savedAt}. Nothing here can be undone — take a fresh backup first.</>
            : <>No restore point has ever been saved. Nothing here can be undone — take a backup first.</>}
      </div>
      <button onClick={()=>{onBackup();setTick(t=>t+1);}}
        style={{padding:"9px 15px",background:freshToday?"transparent":C.amber,border:`1px solid ${C.amber}`,borderRadius:6,
          color:freshToday?C.amber:"#111",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
        💾 {freshToday?"Save another restore point":"Save a restore point now"}
      </button>
    </div>
  );
}

function DeleteScreen({season,onDelete,onBackup,notify,onBack}){
  const[cat,setCat]=useState("event");
  const[confirm,setConfirm]=useState(null);
  const nm=id=>season.players.find(p=>p.id===id)?.name??"?";

  const CATS=[
    {key:"event",label:"Sessions & festivals"},
    {key:"match",label:"Matches"},
    {key:"festival",label:"Whole festivals"},
    {key:"injury",label:"Injuries"},
    {key:"player",label:"Players"},
  ];

  const tours=[...(season.activeTournament?[season.activeTournament]:[]),...(season.tournaments||[])];
  const matches=tours.flatMap(t=>(t.teams||[]).flatMap(tm=>(tm.matches||[]).map(m=>({t,tm,m}))));

  const items=()=>{
    if(cat==="event")return (season.events||[])
      .slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)))
      .map(e=>({id:e.id,title:`${evType(e.type).icon} ${e.title||evType(e.type).label}`,
        sub:`${e.date} · ${Object.keys(e.attendance||{}).length} in register, ${Object.keys(e.availability||{}).length} availability`,
        impact:"Removes the event and its register. Training attendance percentages will change. Any festival it started is left alone.",
        run:()=>onDelete.event(e.id)}));
    if(cat==="match")return matches.map(({t,tm,m})=>{
      const hv=matchHalves(m);
      const n=Object.values(hv).filter(v=>v>0).length;
      return{id:m.id,title:`Match ${m.num} v ${m.opposition||"TBC"}`,
        sub:`${t.name} · ${tm.name} · ${m.status}`,
        impact:n?`Takes back ${Object.values(hv).reduce((a,b)=>a+Math.max(0,b),0)} halves from ${n} player${n!==1?"s":""}. Remaining matches are renumbered.`
                :"This match recorded no game time. Remaining matches are renumbered.",
        run:()=>onDelete.match(m.id)};
    });
    if(cat==="festival")return tours.map(t=>{
      const hv=tournamentHalvesMap(t);
      const total=Object.values(hv).reduce((a,b)=>a+b,0);
      const live=season.activeTournament?.id===t.id;
      return{id:t.id,title:`🏉 ${t.name}${live?" (live)":""}`,
        sub:`${t.date} · ${(t.teams||[]).length} team(s), ${(t.teams||[]).reduce((a,tm)=>a+(tm.matches||[]).length,0)} matches`,
        impact:live?"Discards the live festival and its matches. Nothing has reached season totals yet, so no game time is lost."
                   :`Removes the festival and takes ${total} halves back off season totals. The diary entry stays.`,
        run:()=>onDelete.festival(t.id)};
    });
    if(cat==="injury")return (season.injuries||[]).map(i=>({id:i.id,
      title:`${isHeadInjury(i.type)?"⚠ ":""}${nm(i.playerId)} — ${injuryLabel(i.type)}`,
      sub:`${i.date}${i.contextLabel?" · "+i.contextLabel:""} · ${i.status}`,
      impact:"Removes the record entirely. If this was the only thing keeping them out, they become available again.",
      run:()=>onDelete.injury(i.id)}));
    return season.players.map(p=>({id:p.id,title:p.name+(p.left?" · left":""),
      sub:`${p.seasonHalves} halves · ${(season.injuries||[]).filter(i=>i.playerId===p.id).length} injuries · ${combosFor(season,p.id).length} links`,
      impact:"Erases them completely — every register entry, availability answer, injury, link and selection. Their history cannot be recovered. For a child who has actually left, use Mark as left on their profile instead.",
      run:()=>onDelete.player(p.id),danger:true}));
  };

  const list=items();

  return(
    <>
      <Breadcrumb crumbs={[{label:"More",onClick:onBack},{label:"Delete"}]}/>
      <h2 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:26,fontWeight:900,color:C.red,margin:"0 0 3px"}}>Delete Something</h2>
      <div style={{fontSize:12,color:C.muted,marginBottom:14}}>For clearing up mistakes. Every deletion shows what it will do first.</div>

      <BackupPrompt onBackup={onBackup} notify={notify}/>

      <div style={{display:"flex",gap:5,marginBottom:14,flexWrap:"wrap"}}>
        {CATS.map(c=><Pill key={c.key} active={cat===c.key} onClick={()=>{setCat(c.key);setConfirm(null);}}>{c.label}</Pill>)}
      </div>

      <Card>
        {list.length===0&&<p style={{fontSize:13,color:C.muted}}>Nothing here.</p>}
        {list.map(it=>(
          <div key={it.id} style={{borderBottom:`1px solid ${C.border}`,padding:"11px 0"}}>
            {confirm===it.id?(
              <div>
                <div style={{fontSize:15,fontWeight:600,color:C.text,marginBottom:6}}>{it.title}</div>
                <div style={{background:it.danger?"#3d1416":"#101b33",border:`1px solid ${it.danger?C.red:C.border}`,borderRadius:6,padding:"10px 12px",fontSize:12,color:it.danger?"#ff9999":C.soft,lineHeight:1.7,marginBottom:10}}>
                  {it.impact}
                </div>
                <BackupPrompt onBackup={onBackup} notify={notify} tone="inline"/>
                <div style={{display:"flex",gap:10}}>
                  <Ghost onClick={()=>setConfirm(null)}>Cancel</Ghost>
                  <PBtn style={{marginTop:0,flex:1}} color={C.red} onClick={()=>{it.run();setConfirm(null);notify("Deleted");}}>Delete permanently</PBtn>
                </div>
              </div>
            ):(
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
                <div style={{minWidth:0}}>
                  <div style={{fontSize:15,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{it.title}</div>
                  <div style={{fontSize:11,color:C.muted,marginTop:2}}>{it.sub}</div>
                </div>
                <button onClick={()=>setConfirm(it.id)} style={{padding:"6px 12px",borderRadius:5,border:`1px solid ${C.red}`,background:"transparent",color:C.red,fontSize:12,cursor:"pointer",fontFamily:"inherit",flexShrink:0}}>Delete</button>
              </div>
            )}
          </div>
        ))}
      </Card>

      <p style={{fontSize:11,color:"#8296b2",lineHeight:1.7}}>
        Other things are deleted where they live: a try on the match screen, a link or a snapshot on a player's
        profile, a restore point under Saved restore points.
      </p>
    </>
  );
}

function DiaryScreen({season,players,onOpenEvent,onAddEvent,onImport,onOpenTournament}){
  const evs=allEvents(season);
  const future=evs.filter(e=>isFuture(e.date)).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const past=evs.filter(e=>!isFuture(e.date)).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const festCount=evs.filter(e=>e.type==="festival").length;
  const tourFor=e=>{if(!e.tournamentId)return null;if(season.activeTournament?.id===e.tournamentId)return season.activeTournament;return (season.tournaments||[]).find(t=>t.id===e.tournamentId)||null;};

  const Row=({e})=>{
    const t=evType(e.type);
    const fut=isFuture(e.date);
    const tour=tourFor(e);
    const nMatches=tour?(tour.teams||[]).reduce((a,tm)=>a+(tm.matches||[]).length,0):0;
    const attended=players.filter(p=>["present","late"].includes(e.attendance?.[p.id])).length;
    const marked=Object.keys(e.attendance||{}).length;
    const yes=players.filter(p=>e.availability?.[p.id]==="yes").length;
    const no=players.filter(p=>e.availability?.[p.id]==="no").length;
    const asked=Object.keys(e.availability||{}).length;
    return(
      <div onClick={()=>onOpenEvent(e.id)} style={{display:"flex",gap:11,alignItems:"center",background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"12px 13px",marginBottom:8,cursor:"pointer"}}>
        <div style={{fontSize:19,flexShrink:0}}>{t.icon}</div>
        <div style={{minWidth:0,flex:1}}>
          <div style={{fontSize:15,fontWeight:600,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.title||t.label}</div>
          <div style={{fontSize:11,color:C.muted,marginTop:2}}>
            {e.date}{e.location?` · ${e.location}`:""}
            {tour?` · ${(tour.teams||[]).length} team${(tour.teams||[]).length!==1?"s":""}, ${nMatches} match${nMatches!==1?"es":""}`:""}
            {tour&&season.activeTournament?.id===tour.id?" · live":""}
          </div>
        </div>
        <div style={{textAlign:"right",flexShrink:0}}>
          {fut
            ? (asked
                ? <><div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:17,fontWeight:900,color:C.lime}}>{yes}<span style={{color:C.muted,fontSize:13}}>/{players.length}</span></div><div style={{fontSize:9,color:no?C.red:C.muted}}>{no?`${no} unavailable`:"available"}</div></>
                : <div style={{fontSize:10,color:C.amber}}>no availability yet</div>)
            : (marked
                ? <><div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:17,fontWeight:900,color:C.lime}}>{attended}<span style={{color:C.muted,fontSize:13}}>/{players.length}</span></div><div style={{fontSize:9,color:C.muted}}>attended</div></>
                : <div style={{fontSize:10,color:C.amber}}>no register</div>)}
        </div>
      </div>
    );
  };

  return(
    <>
      <h2 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:26,fontWeight:900,color:C.lime,margin:"0 0 3px"}}>Season Diary</h2>
      <div style={{fontSize:12,color:C.muted,marginBottom:16}}>{past.length} logged · {future.length} planned · {festCount} festival{festCount!==1?"s":""}</div>

      <div style={{display:"flex",gap:7,marginBottom:18,flexWrap:"wrap"}}>
        {EV_TYPES.map(t=>(
          <button key={t.key} onClick={()=>onAddEvent(t.key)} style={{flex:"1 1 30%",padding:"10px 8px",background:"#16233f",border:`1px solid ${C.border}`,borderRadius:7,color:C.soft,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>
            {t.icon} Add {t.label.toLowerCase()}
          </button>
        ))}
      </div>
      <Ghost onClick={onImport} style={{width:"100%",textAlign:"center",marginBottom:22}}>📋 Import attendance code</Ghost>

      {future.length>0&&<>
        <SHead>Coming up</SHead>
        {future.map(e=><Row key={e.id} e={e}/>)}
        <div style={{height:14}}/>
      </>}

      <SHead>Already happened</SHead>
      {past.length===0&&<Card><p style={{fontSize:13,color:C.muted}}>Nothing logged yet.</p></Card>}
      {past.map(e=><Row key={e.id} e={e}/>)}

    </>
  );
}

function EventScreen({event,players,patchEvent,deleteEvent,onBack,notify,onStartTournament,onOpenMatches,onExport}){
  const fut=isFuture(event.date);
  const[tab,setTab]=useState(fut?"avail":"register");
  const[confirmDel,setConfirmDel]=useState(false);
  const[filt,setFilt]=useState(null);
  const att=event.attendance||{}, av=event.availability||{};
  const t=evType(event.type);

  const setAtt=(pid,st)=>patchEvent(event.id,{attendance:{...att,[pid]:att[pid]===st?undefined:st}});
  const setAv=(pid,st)=>patchEvent(event.id,{availability:{...av,[pid]:av[pid]===st?undefined:st}});
  const allAtt=st=>{const a={};players.forEach(p=>{a[p.id]=st;});patchEvent(event.id,{attendance:a});};
  const allAv=st=>{const a={};players.forEach(p=>{a[p.id]=st;});patchEvent(event.id,{availability:a});};
  const copyAvail=()=>{
    const a={...att};
    players.forEach(p=>{if(av[p.id]==="no")a[p.id]="excused";});
    patchEvent(event.id,{attendance:a});
    notify("Known absences marked excused ✓");
  };

  const states=tab==="avail"?AVAIL:ATT_STATES;
  const cur=tab==="avail"?av:att;
  const setCur=tab==="avail"?setAv:setAtt;
  const sorted=[...players].sort((a,b)=>a.name.localeCompare(b.name))
    .filter(p=>!filt||(filt==="__unset"?!cur[p.id]:cur[p.id]===filt));

  return(
    <>
      <Breadcrumb crumbs={[{label:"Diary",onClick:onBack},{label:event.title||t.label}]}/>
      <Card>
        <Lbl mt={0}>Title</Lbl>
        <Inp value={event.title} onChange={e=>patchEvent(event.id,{title:e.target.value})}/>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          <div style={{flex:1,minWidth:130}}><Lbl>Date</Lbl><Inp type="date" value={event.date} onChange={e=>patchEvent(event.id,{date:e.target.value})}/></div>
          <div style={{flex:1,minWidth:130}}><Lbl>Location</Lbl><Inp placeholder="optional" value={event.location||""} onChange={e=>patchEvent(event.id,{location:e.target.value})}/></div>
        </div>
        <Lbl>Type</Lbl>
        <div style={{display:"flex",gap:6}}>
          {EV_TYPES.map(x=>(
            <button key={x.key} onClick={()=>patchEvent(event.id,{type:x.key})} style={{flex:1,padding:"9px",borderRadius:6,cursor:"pointer",fontFamily:"inherit",fontSize:13,border:`1px solid ${event.type===x.key?x.col:"#35486b"}`,background:event.type===x.key?x.col:"#16233f",color:event.type===x.key?"#111":C.soft,fontWeight:event.type===x.key?700:400}}>{x.icon} {x.label}</button>
          ))}
        </div>
        <Lbl>Notes</Lbl>
        <textarea value={event.notes||""} onChange={e=>patchEvent(event.id,{notes:e.target.value})} placeholder="What you worked on, anything worth remembering…"
          style={{background:"#16233f",border:`1px solid ${C.border}`,borderRadius:6,color:C.text,padding:"10px 12px",fontSize:16,width:"100%",height:70,outline:"none",resize:"vertical",fontFamily:"inherit",boxSizing:"border-box"}}/>
      </Card>

      {event.type==="festival"&&(
        <Card style={{border:`1px solid ${event.tournamentId?C.grass:C.lime}`}}>
          {event.tournamentId
            ? <>
                <p style={{fontSize:13,color:C.soft,marginBottom:12,lineHeight:1.6}}>Teams and matches are set up for this festival.</p>
                <PBtn style={{marginTop:0}} color={C.lime} onClick={onOpenMatches}>🏉 Open matches →</PBtn>
              </>
            : <>
                <p style={{fontSize:13,color:C.soft,marginBottom:12,lineHeight:1.6}}>
                  Set up teams and matches when you get there. Name, date, location and everyone's availability carry across, so nothing is entered twice.
                </p>
                <PBtn style={{marginTop:0}} color={C.lime} onClick={()=>onStartTournament(event)}>🏉 Set up teams &amp; matches</PBtn>
              </>}
        </Card>
      )}

      <div style={{display:"flex",gap:6,marginBottom:12}}>
        <button onClick={()=>setTab("avail")} style={{flex:1,padding:"11px",borderRadius:7,cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",fontSize:15,fontWeight:700,letterSpacing:0.5,border:`1px solid ${tab==="avail"?C.blue:"#35486b"}`,background:tab==="avail"?C.blue:"transparent",color:tab==="avail"?"#fff":C.soft}}>Availability</button>
        <button onClick={()=>setTab("register")} style={{flex:1,padding:"11px",borderRadius:7,cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",fontSize:15,fontWeight:700,letterSpacing:0.5,border:`1px solid ${tab==="register"?C.grass:"#35486b"}`,background:tab==="register"?C.grass:"transparent",color:tab==="register"?"#fff":C.soft}}>Register</button>
      </div>

      <Card>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:12}}>
          {states.map(st=>(
            <StatChip key={st.key} label={st.label} col={st.col} active={filt===st.key}
              onClick={()=>setFilt(filt===st.key?null:st.key)}
              value={players.filter(p=>cur[p.id]===st.key).length}/>
          ))}
          <StatChip label="Not set" col={C.soft} active={filt==="__unset"}
            onClick={()=>setFilt(filt==="__unset"?null:"__unset")}
            value={players.filter(p=>!cur[p.id]).length}/>
        </div>
        {filt&&<div style={{fontSize:12,color:C.lime,marginBottom:10}}>
          Showing {filt==="__unset"?"players with nothing recorded":states.find(x=>x.key===filt)?.label.toLowerCase()} ·{" "}
          <button onClick={()=>setFilt(null)} style={{background:"none",border:"none",color:C.soft,fontSize:12,cursor:"pointer",fontFamily:"inherit",textDecoration:"underline",padding:0}}>show everyone</button>
        </div>}
        <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
          {tab==="avail"
            ? <><Ghost onClick={()=>allAv("yes")}>All available</Ghost><Ghost onClick={()=>allAv(null)}>Clear</Ghost></>
            : <><Ghost onClick={()=>allAtt("present")}>All present</Ghost><Ghost onClick={copyAvail}>Excuse known absences</Ghost></>}
        </div>
        {sorted.length===0&&<p style={{fontSize:13,color:C.muted,padding:"8px 0"}}>Nobody in that group.</p>}
        {sorted.map(p=>(
          <div key={p.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,padding:"7px 0",borderBottom:`1px solid ${C.border}`}}>
            <span style={{fontSize:14,flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</span>
            <div style={{display:"flex",gap:4,flexShrink:0}}>
              {states.map(st=>(
                <button key={st.key} onClick={()=>setCur(p.id,st.key)} title={st.label}
                  style={{width:36,height:32,borderRadius:5,cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:700,
                    background:cur[p.id]===st.key?st.col:"#16233f",color:cur[p.id]===st.key?"#111":"#93a4c0",
                    border:`1px solid ${cur[p.id]===st.key?st.col:"#35486b"}`}}>{st.short}</button>
              ))}
            </div>
          </div>
        ))}
        <p style={{fontSize:11,color:"#8296b2",marginTop:10}}>
          {tab==="avail"?"Record these weeks ahead so you can balance game time before the gap arrives.":"P present · L late · E excused (not counted) · A absent."}
        </p>
      </Card>

      {confirmDel
        ? <Card style={{border:`1px solid ${C.red}`}}>
            <p style={{fontSize:13,color:C.soft,marginBottom:12}}>Delete this event and its records? Cannot be undone.</p>
            <div style={{display:"flex",gap:10}}>
              <Ghost onClick={()=>setConfirmDel(false)}>Cancel</Ghost>
              <PBtn style={{marginTop:0,flex:1}} color={C.red} onClick={()=>{deleteEvent(event.id);onBack();notify("Event deleted");}}>Delete</PBtn>
            </div>
          </Card>
        : <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <Ghost onClick={()=>onExport(event)} style={{flex:1,textAlign:"center"}}>↗ Export this event</Ghost>
            <Ghost onClick={()=>setConfirmDel(true)} style={{color:C.red,borderColor:C.red}}>Delete</Ghost>
          </div>}
    </>
  );
}

function SquadScreen({season,players,onOpenPlayer,onAssess,addPlayer,updatePlayer,notify}){
  const[q,setQ]=useState("");
  const[filt,setFilt]=useState("all");
  const[sortBy,setSortBy]=useState("name");
  const[adding,setAdding]=useState(false);
  const[showLeft,setShowLeft]=useState(false);
  const[newName,setNewName]=useState("");
  const[guest,setGuest]=useState(false);
  const evs=allEvents(season).filter(e=>e.type==="training");

  let list=players.filter(p=>(showLeft?true:!p.left)&&(!q||p.name.toLowerCase().includes(q.toLowerCase())));
  if(filt!=="all") list=list.filter(p=>p.positions.includes(filt));
  list=[...list].sort((a,b)=>{
    if(sortBy==="training")return (attStats(evs,b.id).rate??-1)-(attStats(evs,a.id).rate??-1);
    if(sortBy==="halves")return b.seasonHalves-a.seasonHalves;
    return a.name.localeCompare(b.name);
  });

  return(
    <>
      <h2 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:26,fontWeight:900,color:C.lime,margin:"0 0 3px"}}>Squad</h2>
      <div style={{fontSize:12,color:C.muted,marginBottom:14}}>
        {players.filter(p=>!p.left).length} players
        {players.some(p=>p.left)&&<> · <button onClick={()=>setShowLeft(v=>!v)} style={{background:"none",border:"none",color:showLeft?C.lime:C.muted,fontSize:12,cursor:"pointer",fontFamily:"inherit",padding:0,textDecoration:"underline"}}>{showLeft?"hide":"show"} {players.filter(p=>p.left).length} who have left</button></>}
      </div>

      <PBtn style={{marginTop:0,marginBottom:10}} color={C.blue} onClick={onAssess}>⚡ Rapid Assess</PBtn>

      <Inp placeholder="Search…" value={q} onChange={e=>setQ(e.target.value)} style={{marginBottom:10}}/>

      <div style={{display:"flex",gap:5,marginBottom:8,flexWrap:"wrap"}}>
        <Pill active={filt==="all"} onClick={()=>setFilt("all")}>All</Pill>
        {POSITIONS.map(x=><Pill key={x.key} active={filt===x.key} onClick={()=>setFilt(x.key)}>{x.short}</Pill>)}
      </div>
      <div style={{display:"flex",gap:5,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
        <span style={{fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:1}}>Sort</span>
        <Pill active={sortBy==="name"} onClick={()=>setSortBy("name")}>Name</Pill>
        <Pill active={sortBy==="training"} onClick={()=>setSortBy("training")}>Training</Pill>
        <Pill active={sortBy==="halves"} onClick={()=>setSortBy("halves")}>Halves</Pill>
      </div>

      <Card style={{padding:"4px 16px"}}>
        {list.length===0&&<p style={{fontSize:13,color:C.muted,padding:"14px 0"}}>Nobody matches.</p>}
        {list.map(p=>{
          const a=attStats(evs,p.id);
          const tn=tournamentsAttended(season,p.id);
          const unavail=upcomingUnavailable(season,p.id).length;
          return(
            <div key={p.id} onClick={()=>onOpenPlayer(p.id)} style={{padding:"12px 0",borderBottom:`1px solid ${C.border}`,cursor:"pointer"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
                <span style={{fontSize:15,fontWeight:600,color:p.left?C.muted:p.ill?C.muted:C.text,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",textDecoration:p.left?"line-through":"none"}}>
                  {p.name}{p.isGuest?" 👤":""}{p.ill?" 🤒":""}{p.left?" · left":""}
                </span>
                <span style={{color:C.muted,fontSize:17,flexShrink:0}}>›</span>
              </div>
              <div style={{display:"flex",gap:12,marginTop:5,flexWrap:"wrap",alignItems:"center"}}>
                <span style={{fontSize:11,color:C.muted}}>🏃 <span style={{color:a.rate===null?"#8296b2":a.rate>=80?C.lime:a.rate>=50?C.amber:C.red,fontWeight:700}}>{a.rate===null?"—":a.rate+"%"}</span></span>
                <span style={{fontSize:11,color:C.muted}}>🏆 <span style={{color:C.text,fontWeight:700}}>{tn}</span></span>
                <span style={{fontSize:11,color:C.muted}}>⏱ <span style={{color:C.text,fontWeight:700}}>{p.seasonHalves}</span> halves</span>
                {unavail>0&&<span style={{fontSize:11,color:C.red}}>✕ {unavail} ahead</span>}
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:5}}>
                {p.positions.length===0&&<span style={{fontSize:10,color:"#8296b2"}}>no positions set</span>}
                {p.positions.map(k=><span key={k} style={{background:p.primary===k?C.amber:"#1d2b4a",color:p.primary===k?"#111":C.soft,border:`1px solid ${p.primary===k?C.amber:"#35486b"}`,borderRadius:4,padding:"1px 6px",fontSize:10,fontWeight:p.primary===k?700:400}}>{posShort(k)}</span>)}
                {(p.preferred||[]).length>0&&<span style={{fontSize:10,color:C.blue,marginLeft:2}}>♥ {(p.preferred||[]).map(posShort).join(" ")}</span>}
              </div>
            </div>
          );
        })}
      </Card>

      {adding?(
        <Card>
          <Lbl mt={0}>Add player</Lbl>
          <Inp placeholder="Name…" value={newName} onChange={e=>setNewName(e.target.value)}/>
          <div style={{display:"flex",gap:6,marginTop:8}}>
            <Pill active={!guest} onClick={()=>setGuest(false)}>Permanent</Pill>
            <Pill active={guest} onClick={()=>setGuest(true)} col={C.blue}>Guest</Pill>
          </div>
          <div style={{display:"flex",gap:10,marginTop:12}}>
            <Ghost onClick={()=>{setAdding(false);setNewName("");}}>Cancel</Ghost>
            <PBtn style={{marginTop:0,flex:1}} disabled={!newName.trim()} onClick={()=>{addPlayer(newName,guest);setNewName("");setAdding(false);notify("Player added ✓");}}>Add</PBtn>
          </div>
        </Card>
      ):<Ghost onClick={()=>setAdding(true)} style={{width:"100%",textAlign:"center",marginTop:12}}>+ Add player</Ghost>}
    </>
  );
}

function AnalysisScreen({season,players,onOpenPlayer}){
  const[filt,setFilt]=useState("all");
  const[sortKey,setSortKey]=useState("name");
  const[desc,setDesc]=useState(false);
  const[cols,setCols]=useState(["training","tournaments","halves"]);
  const evs=allEvents(season).filter(e=>e.type==="training");

  const COLS=[
    {key:"training",label:"Train %",get:p=>attStats(evs,p.id).rate,fmt:v=>v===null?"—":v+"%"},
    {key:"sessions",label:"Sessions",get:p=>attStats(evs,p.id).attended,fmt:v=>v},
    {key:"tournaments",label:"Fests",get:p=>tournamentsAttended(season,p.id),fmt:v=>v},
    {key:"halves",label:"Halves",get:p=>p.seasonHalves,fmt:v=>v},
    {key:"treds",label:"TREDS",get:p=>tredsScore(p)?.avg??null,fmt:v=>v===null?"—":v.toFixed(1)},
    {key:"combos",label:"Links",get:p=>combosFor(season,p.id).length,fmt:v=>v},
    {key:"focus",label:"Focus",get:p=>p.focus.length,fmt:v=>v},
    {key:"unavail",label:"Away",get:p=>upcomingUnavailable(season,p.id).length,fmt:v=>v},
  ];
  const active=COLS.filter(c=>cols.includes(c.key));

  let rows=players.filter(p=>!p.left&&(filt==="all"||p.positions.includes(filt)));
  rows=[...rows].sort((a,b)=>{
    if(sortKey==="name")return desc?b.name.localeCompare(a.name):a.name.localeCompare(b.name);
    const c=COLS.find(x=>x.key===sortKey);
    const av=c.get(a)??-1, bv=c.get(b)??-1;
    return desc?av-bv:bv-av;
  });

  const csv=()=>{
    const head=["Name","Positions","Preferred",...active.map(c=>c.label)].join(",");
    const body=rows.map(p=>[
      '"'+p.name+'"',
      '"'+p.positions.map(posLabel).join("; ")+'"',
      '"'+(p.preferred||[]).map(posLabel).join("; ")+'"',
      ...active.map(c=>{const v=c.get(p);return v===null||v===undefined?"":v;})
    ].join(",")).join("\n");
    const out=head+"\n"+body;
    navigator.clipboard?.writeText(out);
    return out;
  };
  const[copied,setCopied]=useState(false);

  return(
    <>
      <h2 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:26,fontWeight:900,color:C.lime,margin:"0 0 3px"}}>Analysis</h2>
      <div style={{fontSize:12,color:C.muted,marginBottom:14}}>{rows.length} of {players.length} players</div>

      <SHead>Filter by position</SHead>
      <div style={{display:"flex",gap:5,marginBottom:14,flexWrap:"wrap"}}>
        <Pill active={filt==="all"} onClick={()=>setFilt("all")}>All</Pill>
        {POSITIONS.map(x=><Pill key={x.key} active={filt===x.key} onClick={()=>setFilt(x.key)}>{x.short}</Pill>)}
      </div>

      <SHead>Columns</SHead>
      <div style={{display:"flex",gap:5,marginBottom:14,flexWrap:"wrap"}}>
        {COLS.map(c=>(
          <Pill key={c.key} active={cols.includes(c.key)} onClick={()=>setCols(v=>v.includes(c.key)?v.filter(x=>x!==c.key):[...v,c.key])}>{c.label}</Pill>
        ))}
      </div>

      <Card style={{padding:"6px 10px",overflowX:"auto"}}>
        <p style={{fontSize:11,color:"#8296b2",marginBottom:6}}>Tap a name to open their profile. Tap a column heading to sort.</p>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead>
            <tr>
              <th onClick={()=>{setSortKey("name");setDesc(sortKey==="name"?!desc:false);}}
                style={{textAlign:"left",padding:"8px 4px",color:sortKey==="name"?C.lime:C.muted,fontSize:10,textTransform:"uppercase",letterSpacing:0.5,cursor:"pointer",borderBottom:`1px solid ${C.border}`,position:"sticky",left:0,background:C.card}}>Name</th>
              {active.map(c=>(
                <th key={c.key} onClick={()=>{setSortKey(c.key);setDesc(sortKey===c.key?!desc:false);}}
                  style={{textAlign:"right",padding:"8px 5px",color:sortKey===c.key?C.lime:C.muted,fontSize:10,textTransform:"uppercase",letterSpacing:0.5,cursor:"pointer",borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap"}}>
                  {c.label}{sortKey===c.key?(desc?" ▲":" ▼"):""}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map(p=>(
              <tr key={p.id} onClick={()=>onOpenPlayer&&onOpenPlayer(p.id)} style={{cursor:"pointer"}}>
                <td style={{padding:"8px 4px",borderBottom:`1px solid #22314e`,color:C.lime,position:"sticky",left:0,background:C.card,whiteSpace:"nowrap"}}>{p.name} <span style={{color:C.muted,fontSize:10}}>›</span></td>
                {active.map(c=>(
                  <td key={c.key} style={{padding:"8px 5px",borderBottom:`1px solid #22314e`,textAlign:"right",color:C.soft,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,fontSize:14}}>{c.fmt(c.get(p))}</td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </Card>

      <Ghost onClick={()=>{csv();setCopied(true);setTimeout(()=>setCopied(false),2000);}} style={{width:"100%",textAlign:"center"}}>
        {copied?"✓ Copied — paste into Sheets or Excel":"📋 Copy as spreadsheet (CSV)"}
      </Ghost>

      <div style={{height:16}}/>
      <SHead>Data health</SHead>
      <Card>
        {(()=>{const h=dataHealth(season);
          const items=[
            ["Players with no positions set",h.noPositions,C.red],
            ["Players with no preferred position",h.noPreferred,C.amber],
            ["Players with no TREDS assessment",h.noTreds,C.amber],
            ["Past events with no register",h.pastNoRegister,C.red],
            ["Future events with no availability",h.futureNoAvail,C.amber],
          ];
          return items.map(([l,n,col])=>(
            <div key={l} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,padding:"7px 0",borderBottom:`1px solid ${C.border}`}}>
              <span style={{fontSize:13,color:n>0?C.text:C.muted}}>{l}</span>
              <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:17,fontWeight:900,color:n>0?col:C.lime,flexShrink:0}}>{n===0?"✓":n}</span>
            </div>
          ));
        })()}
        <p style={{fontSize:11,color:"#8296b2",marginTop:10}}>Gaps are shown rather than filled. An empty rating is honest; a guessed one is not.</p>
      </Card>
    </>
  );
}

function TabBar({view,setTab,hasTournament}){
  const TABS=[
    {key:"diary",icon:"📅",label:"Diary",views:["diary","event"]},
    {key:"squad",icon:"👥",label:"Squad",views:["squad","player","assess"]},
    {key:"match",icon:"🏉",label:"Match",views:["home","tournament"]},
    {key:"analysis",icon:"📈",label:"Analysis",views:["analysis"]},
  ];
  return(
    <div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:200,background:"rgba(18,18,18,0.98)",borderTop:`1px solid ${C.border}`,backdropFilter:"blur(8px)",display:"flex",paddingBottom:"env(safe-area-inset-bottom)"}}>
      {TABS.map(t=>{
        const on=t.views.includes(view);
        return(
          <button key={t.key} onClick={()=>setTab(t.key)} style={{flex:1,padding:"9px 2px 10px",background:"none",border:"none",cursor:"pointer",fontFamily:"inherit",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
            <span style={{fontSize:18,opacity:on?1:0.45,position:"relative"}}>
              {t.icon}
              {t.key==="match"&&hasTournament&&<span style={{position:"absolute",top:-1,right:-5,width:7,height:7,borderRadius:4,background:C.lime}}/>}
            </span>
            <span style={{fontSize:10,color:on?C.lime:C.muted,fontWeight:on?700:400,letterSpacing:0.3}}>{t.label}</span>
          </button>
        );
      })}
    </div>
  );
}

function AssessScreen({season,players,updatePlayer,notify,onBack,onOpenPlayer}){
  const[mode,setMode]=useState("treds");
  const DIMS=mode==="treds"
    ? BEHAVIOURS.map(x=>({...x,kind:"behaviour"}))
    : POSITIONS.map(x=>({...x,kind:"position"}));
  const[idx,setIdx]=useState(0);
  const[hideRated,setHideRated]=useState(false);
  const d=DIMS[idx];
  const field=d.kind==="skill"?"competence":"behaviour";

  const val=p=>p.behaviour?.[d.key]||0;
  const setVal=(p,v)=>updatePlayer(p.id,{behaviour:{...(p.behaviour||{}),[d.key]:val(p)===v?0:v}});
  // position mode: off -> can play -> primary -> off
  const posState=p=>p.primary===d.key?2:p.positions.includes(d.key)?1:0;
  const cyclePos=p=>{
    const st=posState(p);
    if(st===0)updatePlayer(p.id,{positions:[...p.positions,d.key]});
    else if(st===1)updatePlayer(p.id,{primary:d.key});
    else updatePlayer(p.id,{positions:p.positions.filter(k=>k!==d.key),primary:null});
  };

  const sorted=[...players].sort((a,b)=>a.name.localeCompare(b.name));
  const shown=hideRated?sorted.filter(p=>mode==="treds"?val(p)===0:posState(p)===0):sorted;
  const done=mode==="treds"?sorted.filter(p=>val(p)>0).length:sorted.filter(p=>posState(p)>0).length;

  const snapshotAll=()=>{
    const dt=today();
    players.forEach(pl=>{
      updatePlayer(pl.id,{assessments:[{id:uid(),date:dt,competence:{...pl.competence},behaviour:{...pl.behaviour}},...(pl.assessments||[])]});
    });
    notify(`Snapshot saved for ${players.length} players ✓`);
  };

  return(
    <>
      <Breadcrumb crumbs={[{label:"Players",onClick:onBack},{label:"Rapid Assess"}]}/>

      <div style={{display:"flex",gap:6,marginBottom:12}}>
        <button onClick={()=>{setMode("treds");setIdx(0);}} style={{flex:1,padding:"11px",borderRadius:7,cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",fontSize:15,fontWeight:700,letterSpacing:0.5,border:`1px solid ${mode==="treds"?C.blue:"#35486b"}`,background:mode==="treds"?C.blue:"transparent",color:mode==="treds"?"#fff":C.soft}}>Core Values</button>
        <button onClick={()=>{setMode("pos");setIdx(0);}} style={{flex:1,padding:"11px",borderRadius:7,cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",fontSize:15,fontWeight:700,letterSpacing:0.5,border:`1px solid ${mode==="pos"?C.lime:"#35486b"}`,background:mode==="pos"?C.lime:"transparent",color:mode==="pos"?"#111":C.soft}}>Positions</button>
      </div>

      <Card style={{position:"sticky",top:"calc(env(safe-area-inset-top) + 54px)",zIndex:80}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginBottom:10}}>
          <button onClick={()=>setIdx(i=>Math.max(0,i-1))} disabled={idx===0}
            style={{padding:"8px 12px",background:"transparent",border:`1px solid ${idx===0?"#1a2740":C.border}`,borderRadius:5,color:idx===0?"#35486b":C.soft,fontSize:14,cursor:idx===0?"not-allowed":"pointer",fontFamily:"inherit"}}>←</button>
          <div style={{textAlign:"center",minWidth:0,flex:1}}>
            <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:1.5,fontFamily:"'Barlow Condensed',sans-serif"}}>
              {mode==="treds"?"Core Values":"Position"} · {idx+1} of {DIMS.length}
            </div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:700,color:mode==="treds"?C.blue:C.lime,lineHeight:1.2}}>{d.label}</div>
          </div>
          <button onClick={()=>setIdx(i=>Math.min(DIMS.length-1,i+1))} disabled={idx===DIMS.length-1}
            style={{padding:"8px 12px",background:idx===DIMS.length-1?"transparent":C.grass,border:`1px solid ${idx===DIMS.length-1?"#1a2740":C.grass}`,borderRadius:5,color:idx===DIMS.length-1?"#35486b":"#fff",fontSize:14,cursor:idx===DIMS.length-1?"not-allowed":"pointer",fontFamily:"inherit",fontWeight:700}}>→</button>
        </div>
        {mode==="treds"&&d.kind==="behaviour"&&(
          <div style={{display:"flex",justifyContent:"space-between",gap:8,marginBottom:8}}>
            <span style={{fontSize:11,color:"#93a4c0"}}>1 = {d.low}</span>
            <span style={{fontSize:11,color:"#93a4c0",textAlign:"right"}}>5 = {d.high}</span>
          </div>
        )}
        <div style={{height:4,background:"#1d2b4a",borderRadius:2,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${(done/Math.max(players.length,1))*100}%`,background:C.lime,transition:"width 0.2s"}}/>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:7,gap:8}}>
          <span style={{fontSize:11,color:C.muted}}>{done} of {players.length} rated</span>
          <button onClick={()=>setHideRated(v=>!v)} style={{background:"none",border:"none",color:hideRated?C.lime:C.muted,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>
            {hideRated?"✓ Hiding rated":"Hide already rated"}
          </button>
        </div>
      </Card>

      <Card>
        {shown.length===0&&<p style={{fontSize:13,color:C.muted}}>Everyone rated for this one. Tap → for the next.</p>}
        {shown.map(p=>(
          <div key={p.id} style={{padding:"9px 0",borderBottom:`1px solid ${C.border}`}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:d.kind==="behaviour"?6:0,flexWrap:"wrap"}}>
              <span onClick={()=>onOpenPlayer(p.id)} style={{fontSize:14,cursor:"pointer",minWidth:100,flex:1,color:val(p)>0?C.text:C.soft}}>{p.name}</span>
              {mode==="pos"
                ? <button onClick={()=>cyclePos(p)} style={{minWidth:128,padding:"9px 12px",borderRadius:6,cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:posState(p)===2?700:400,
                    border:`1px solid ${posState(p)===2?C.amber:posState(p)===1?C.grass:"#35486b"}`,
                    background:posState(p)===2?C.amber:posState(p)===1?C.grass:"#16233f",
                    color:posState(p)===2?"#111":posState(p)===1?"#fff":"#93a4c0"}}>
                    {posState(p)===2?"★ Primary":posState(p)===1?"✓ Can play":"— Not here"}
                  </button>
                : <div style={{flex:1,minWidth:180}}>
                    <div style={{display:"flex",gap:4}}>
                      {[1,2,3,4,5].map(n=>(
                        <button key={n} onClick={()=>setVal(p,n)}
                          style={{flex:1,height:32,borderRadius:4,cursor:"pointer",fontFamily:"inherit",fontSize:13,
                            border:`1px solid ${n<=val(p)?C.blue:"#35486b"}`,background:n<=val(p)?C.blue:"#16233f",color:n<=val(p)?"#fff":"#93a4c0"}}>{n}</button>
                      ))}
                    </div>
                  </div>}
            </div>
          </div>
        ))}
      </Card>

      <SHead>When you've finished a pass</SHead>
      <Card>
        <p style={{fontSize:12,color:C.muted,marginBottom:10,lineHeight:1.6}}>
          Saves today's core-value ratings as a dated snapshot for every player, so you can see how the picture moves across the season. Current ratings stay editable.
        </p>
        <Ghost onClick={snapshotAll} style={{width:"100%",textAlign:"center"}}>📌 Snapshot whole squad for {today()}</Ghost>
      </Card>

      <Ghost onClick={onBack} style={{width:"100%",textAlign:"center"}}>← Back to Players</Ghost>
    </>
  );
}

function PlayersScreen({season,players,onOpenPlayer,onBack,onAssess}){
  const[sortBy,setSortBy]=useState("name");
  const evs=trainingEvents(season);
  const cover=FORMATION.map(f=>({...f,label:posLabel(f.key),able:players.filter(p=>!p.isGuest&&!p.left&&p.positions.includes(f.key)).length}));
  const unset=players.filter(p=>p.positions.length===0).length;
  const sorted=[...players].sort((a,b)=>{
    if(sortBy==="halves")return b.seasonHalves-a.seasonHalves;
    if(sortBy==="attendance")return (attStats(evs,b.id).rate??-1)-(attStats(evs,a.id).rate??-1);
    return a.name.localeCompare(b.name);
  });

  return(
    <>
      <Breadcrumb crumbs={[{label:season.name,onClick:onBack},{label:"Players"}]}/>

        <h2 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:28,fontWeight:900,color:C.lime,margin:0}}>Players</h2>
        <div style={{fontSize:12,color:C.muted,marginTop:2}}>{players.length} in the squad{unset>0?` · ${unset} with no positions set`:""}</div>

        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(132px,1fr))",gap:8}}>
          {cover.map(c=>{
            const used=c.count>0;

              <div key={c.key} style={{background:"#101b33",border:`1px solid ${short?C.red:C.border}`,borderRadius:8,padding:"10px 12px"}}>

                <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:900,color:col,marginTop:4}}>{c.able} <span style={{fontSize:12,fontWeight:400,color:C.muted}}>can play</span></div>
              </div>
            );
          })}
        </div>
        <p style={{fontSize:11,color:"#8296b2",marginTop:10}}>Red means fewer players able to cover the position than you need on the pitch.</p>

      <PBtn style={{marginTop:0,marginBottom:14}} color={C.blue} onClick={onAssess}>⚡ Rapid Assess — whole squad, one thing at a time</PBtn>

      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap",alignItems:"center"}}>

        <Pill active={sortBy==="attendance"} onClick={()=>setSortBy("attendance")}>Attendance</Pill>
      </div>

      <Card>
        {sorted.map(p=>{
          const att=attStats(evs,p.id);
          return(
            <div key={p.id} onClick={()=>onOpenPlayer(p.id)}
              style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,padding:"11px 0",borderBottom:`1px solid ${C.border}`,cursor:"pointer"}}>
              <div style={{minWidth:0,flex:1}}>
                <div style={{fontSize:15,fontWeight:500,color:C.text}}>{p.name}{p.isGuest?" 👤":""}</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:5,alignItems:"center"}}>
                  {p.positions.length===0&&<span style={{fontSize:11,color:"#93a4c0"}}>No positions set</span>}
                  {p.positions.map(k=>(
                    <span key={k} style={{background:p.primary===k?C.amber:"#1d2b4a",color:p.primary===k?"#111":C.soft,border:`1px solid ${p.primary===k?C.amber:"#35486b"}`,borderRadius:4,padding:"2px 7px",fontSize:11,fontWeight:p.primary===k?700:400}}>{posShort(k)}</span>
                  ))}
                  {p.focus.length>0&&<span style={{fontSize:11,color:C.blue,marginLeft:2}}>🎯 {p.focus.length}</span>}
                  {combosFor(season,p.id).length>0&&<span style={{fontSize:11,color:C.soft,marginLeft:2}}>🔗 {combosFor(season,p.id).length}</span>}
                </div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
                {att.rate!==null&&<span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,fontWeight:700,color:att.rate>=80?C.lime:att.rate>=50?C.amber:C.red}}>{att.rate}%</span>}

        })}
      </Card>
